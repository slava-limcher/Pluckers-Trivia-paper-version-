<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Trivia Wings — Pluckers</title>
<style>
  :root {
    --red: #c8102e;
    --red-dark: #9a0a22;
    --red-deep: #6b0717;
    --yellow: #f4c430;
    --yellow-bright: #ffd84d;
    --blue: #1d3a8a;
    --blue-dark: #142764;
    --blue-bright: #2a52be;
    --cream: #f7f1e3;
    --black: #0c0c0c;
    --panel: #222;
    --ink: #fff8e7;
    --ink-dim: #d9c9a0;
    --good: #4ade80;
    --bad: #ef4444;
    --shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(1400px 900px at 50% -15%, var(--blue-dark) 0%, #0a1234 60%, #060a1f 100%);
    color: var(--ink);
    font-family: "Impact", "Oswald", "Bebas Neue", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: repeating-linear-gradient(45deg, rgba(244,196,48,.035) 0 14px, transparent 14px 28px);
    pointer-events: none; z-index: 0;
  }
  #app { position: relative; height: 100%; display: flex; flex-direction: column; z-index: 1; }

  /* HEADER */
  header {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 36px;
    background:
      linear-gradient(180deg,
        var(--red) 0, var(--red) 14%,
        var(--blue) 14%, var(--blue) 22%,
        var(--yellow) 22%, var(--yellow) 78%,
        var(--blue) 78%, var(--blue) 86%,
        var(--red) 86%, var(--red) 100%);
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    flex-shrink: 0;
  }
  header::before, header::after {
    content: ""; position: absolute; left: 0; right: 0;
    height: 3px; background: var(--black);
  }
  header::before { top: 22%; }
  header::after { bottom: 22%; }
  header .brand, header .meta { position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 900; letter-spacing: 2px; }
  .brand .logo-badge {
    width: 64px; height: 64px;
    border-radius: 12px;
    background: var(--cream);
    display: grid; place-items: center;
    font-size: 42px;
    box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 -3px 0 rgba(0,0,0,.12);
    border: 3px solid var(--black);
    transform: rotate(-4deg);
  }
  .brand .name {
    font-size: 32px; color: var(--red);
    text-shadow: 3px 3px 0 var(--black);
    line-height: 1;
  }
  .brand .name small {
    display: block; font-size: 12px; color: var(--blue);
    letter-spacing: 6px; margin-top: 4px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.2);
  }
  .meta { display: flex; gap: 12px; font-size: 16px; letter-spacing: 2px; color: var(--blue); }
  .meta .chip {
    background: var(--cream); border: 3px solid var(--blue);
    border-radius: 8px; padding: 6px 14px;
    font-weight: 900; color: var(--red);
  }
  .meta .chip b { color: var(--blue); }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; min-height: 0; overflow: auto;
  }
  .view { width: 100%; max-width: 1500px; text-align: center; }

  /* TITLE */
  .title-wrap { padding: 40px 0; }
  .title-logo {
    position: relative;
    width: 320px; height: 200px;
    margin: 0 auto 24px;
    border-radius: 18px;
    background:
      linear-gradient(135deg,
        var(--red) 0,
        var(--red) 11.5%, var(--black) 11.5%, var(--black) 12.5%,
        var(--blue) 12.5%, var(--blue) 26%, var(--black) 26%, var(--black) 27%,
        var(--yellow) 27%, var(--yellow) 73%, var(--black) 73%, var(--black) 74%,
        var(--blue) 74%, var(--blue) 87.5%, var(--black) 87.5%, var(--black) 88.5%,
        var(--red) 88.5%, var(--red) 100%);
    display: grid; place-items: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    border: 6px solid var(--black);
  }
  .title-logo .logo-em {
    font-size: 130px; line-height: 1;
    filter: drop-shadow(4px 4px 0 var(--black));
  }
  h1.title {
    font-size: 130px; line-height: .95; margin: 0 0 8px;
    color: var(--red);
    text-shadow:
      5px 5px 0 var(--yellow),
      10px 10px 0 var(--blue),
      14px 14px 0 var(--black);
    letter-spacing: 4px;
  }
  h1.title .sub {
    display: block; font-size: 80px;
    color: var(--yellow);
    text-shadow: 4px 4px 0 var(--blue), 8px 8px 0 var(--black);
    letter-spacing: 14px; margin-top: 8px;
  }
  .lead {
    color: var(--ink); font-size: 30px;
    margin: 22px auto 32px; max-width: 960px;
    letter-spacing: 2px; line-height: 1.5;
  }
  .lead b { color: var(--yellow); }

  /* WIN PRIZES badge + INSTRUCTIONS card (title-screen flair, matches paper) */
  .win-prizes {
    position: fixed;
    left: 72px; top: 50%;
    transform: translateY(-50%) rotate(-8deg);
    width: 260px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, var(--yellow-bright), var(--yellow) 70%);
    border: 8px solid var(--red);
    box-shadow: 0 0 0 6px var(--blue), 0 18px 40px rgba(0,0,0,.55);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    line-height: .9; z-index: 5;
  }
  .win-prizes .wp-top {
    color: var(--blue); font-size: 50px; font-weight: 900;
    letter-spacing: 4px; text-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }
  .win-prizes .wp-big {
    color: var(--red); font-size: 70px; font-weight: 900;
    letter-spacing: 2px; text-shadow: 3px 3px 0 var(--black);
  }
  .instructions {
    position: fixed;
    right: 36px; top: 50%;
    transform: translateY(-50%) rotate(2deg);
    width: 460px;
    background: #ffffff;
    border: 6px solid var(--red);
    border-radius: 18px;
    box-shadow: 0 0 0 7px var(--blue), 0 20px 46px rgba(0,0,0,.55);
    padding: 0 0 26px;
    text-align: left;
    overflow: hidden;
    z-index: 5;
  }
  .instructions .instr-header {
    background: var(--red); color: var(--yellow);
    font-size: 40px; font-weight: 900; letter-spacing: 3px;
    padding: 16px 18px; text-align: center;
    text-shadow: 2px 2px 0 var(--black);
    border-bottom: 5px solid var(--black);
  }
  .instructions .instr-qr {
    padding: 16px 16px 12px;
    text-align: center;
    border-bottom: 3px dashed rgba(29,58,138,.25);
  }
  .instructions .instr-qr-box {
    background: #fff;
    border: 3px solid var(--black);
    border-radius: 8px;
    padding: 8px;
    width: 200px; height: 200px;
    margin: 0 auto;
    display: grid; place-items: center;
  }
  .instructions .instr-qr-box img,
  .instructions .instr-qr-box canvas { width: 100% !important; height: 100% !important; }
  .instructions .instr-qr-box .qr-loading {
    color: var(--blue); font-size: 12px; letter-spacing: 2px;
    font-weight: 900; text-align: center;
  }
  .instructions .instr-qr-label {
    color: var(--blue); font-size: 12px; letter-spacing: 3px;
    font-weight: 900; margin-top: 10px;
  }
  .instructions .instr-qr-code {
    color: var(--red); font-size: 32px; letter-spacing: 6px;
    font-weight: 900; margin-top: 2px;
    text-shadow: 2px 2px 0 var(--yellow);
    line-height: 1;
  }
  .instructions .instr-list {
    margin: 14px 0 0;
    padding: 0 22px 0 54px;
    color: var(--blue-dark);
  }
  .instructions .instr-list li {
    font-size: 20px; font-weight: 800;
    line-height: 1.3; margin-bottom: 12px;
    letter-spacing: .3px;
  }
  .instructions .instr-list li:last-child { margin-bottom: 0; }
  .instructions .instr-list li b { color: var(--red); }
  /* MEDIUM-large screens (1600px and below) — shrink decorative side badges
     so they don't crash into the centered title + buttons. */
  @media (max-width: 1600px) {
    .win-prizes { width: 200px; height: 200px; left: 28px; border-width: 7px; }
    .win-prizes .wp-top { font-size: 38px; }
    .win-prizes .wp-big { font-size: 56px; }
    .instructions { width: 320px; right: 22px; }
    .instructions .instr-header { font-size: 30px; }
    .instructions .instr-list { padding: 0 18px 0 48px; }
    .instructions .instr-list li { font-size: 19px; margin-bottom: 12px; }
    .instructions .instr-qr-box { width: 150px; height: 150px; }
  }

  /* NARROW screens (1400px and below) — hide the decorative side widgets entirely.
     The buttons + title + QR still take up plenty of room and would otherwise be
     pushed into / under WIN PRIZES and INSTRUCTIONS. */
  @media (max-width: 1400px) {
    .win-prizes, .instructions { display: none; }
  }

  /* MOBILE / very narrow (900px and below) — also shrink the floating widgets. */
  @media (max-width: 900px) {
    .corner-qr { width: 140px; top: 92px; right: 12px; padding: 12px 8px 8px; }
    .corner-qr .qr-mini { padding: 4px; }
    .corner-qr .qr-label { font-size: 9px; letter-spacing: 1px; }
    .corner-qr .qr-code { font-size: 16px; letter-spacing: 2px; }
    .back-btn { top: 92px; left: 12px; padding: 7px 14px; font-size: 14px; letter-spacing: 2px; }
    .winner-banner { max-width: calc(100vw - 320px); font-size: 13px; padding: 6px 14px; }
    .winner-banner .wb-name { font-size: 18px; max-width: 180px; }
    .winner-banner .wb-score { font-size: 22px; padding: 2px 12px; }
    .q-category { top: 380px; right: 160px; font-size: 28px; padding: 10px 24px; }
  }

  /* BUTTONS */
  .btn {
    --btn-shadow-color: var(--blue-dark);
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    color: var(--cream); border: 4px solid var(--black);
    border-radius: 14px; padding: 18px 36px;
    font-size: 26px; font-weight: 900; letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 10px 0 var(--btn-shadow-color), 0 18px 30px rgba(0,0,0,.5);
    transition: transform .08s ease, box-shadow .12s ease, filter .15s ease;
    font-family: inherit; text-transform: uppercase;
    text-shadow: 2px 2px 0 var(--black);
    min-width: 240px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active {
    transform: translateY(6px);
    box-shadow: 0 4px 0 var(--btn-shadow-color), 0 8px 16px rgba(0,0,0,.5);
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; filter: grayscale(.3); }
  .btn.secondary { background: var(--yellow); color: var(--red); text-shadow: none; }
  .btn.ghost {
    background: transparent; color: var(--yellow);
    border-color: var(--yellow); box-shadow: none; text-shadow: none;
  }
  .btn-row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }

  .hint {
    margin-top: 28px; color: var(--cream);
    font-size: 16px; letter-spacing: 2px;
  }
  .hint kbd {
    display: inline-block; background: var(--yellow); color: var(--red);
    border: 2px solid var(--black); border-bottom-width: 4px;
    border-radius: 6px; padding: 4px 10px; margin: 0 4px;
    font-family: inherit; font-size: 14px; font-weight: 900;
  }

  .status-pill {
    display: inline-block; background: var(--cream); color: var(--blue-dark);
    border: 4px solid var(--blue); border-radius: 999px;
    padding: 14px 36px; font-size: 30px; letter-spacing: 2px;
    margin: 0 0 24px; font-weight: 900;
  }
  .status-pill b { color: var(--red); }
  .status-pill.custom { border-color: var(--red); }
  .status-pill.custom b { color: var(--blue); }

  /* LOBBY */
  .lobby {
    display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
    max-width: 1300px; margin: 0 auto;
    align-items: center;
  }
  .lobby-left {
    background: var(--cream); border: 6px solid var(--blue);
    border-radius: 22px; padding: 36px; color: var(--blue-dark);
    box-shadow: var(--shadow); position: relative;
  }
  .lobby-left::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 14px;
    background: linear-gradient(180deg, var(--red) 0, var(--red) 50%, var(--yellow) 50%, var(--yellow) 100%);
    border-radius: 14px 14px 0 0;
  }
  .lobby-left h2 {
    margin: 20px 0 8px;
    font-size: 32px; color: var(--red); letter-spacing: 3px;
    text-shadow: 2px 2px 0 var(--yellow);
  }
  .lobby-left .room-code {
    font-size: 96px; color: var(--red); letter-spacing: 12px;
    margin: 12px 0;
    text-shadow: 4px 4px 0 var(--yellow), 8px 8px 0 var(--black);
    line-height: 1;
  }
  .lobby-left .join-url {
    color: var(--blue-dark); font-size: 13px; letter-spacing: 1px;
    word-break: break-all; margin: 8px 0 18px;
    font-family: ui-monospace, "Consolas", "Courier New", monospace;
    font-weight: 900;
  }
  .lobby-left .qr-container {
    background: #fff; padding: 14px; border-radius: 12px;
    border: 4px solid var(--black);
    width: 280px; height: 280px;
    margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .lobby-left .qr-container img,
  .lobby-left .qr-container canvas {
    width: 100% !important; height: 100% !important;
  }
  .lobby-right {
    background: var(--cream); border: 6px solid var(--red);
    border-radius: 22px; padding: 28px; color: var(--blue-dark);
    box-shadow: var(--shadow); position: relative;
    min-height: 460px;
    display: flex; flex-direction: column;
  }
  .lobby-right::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 14px;
    background: linear-gradient(180deg, var(--blue) 0, var(--blue) 50%, var(--yellow) 50%, var(--yellow) 100%);
    border-radius: 14px 14px 0 0;
  }
  .lobby-right h2 {
    margin: 20px 0 4px;
    font-size: 32px; color: var(--blue); letter-spacing: 3px;
    text-shadow: 2px 2px 0 var(--yellow);
  }
  .lobby-right .count {
    color: var(--red); font-size: 64px; font-weight: 900;
    letter-spacing: 4px; line-height: 1; margin: 8px 0 16px;
    text-shadow: 3px 3px 0 var(--yellow);
  }
  .lobby-teams {
    flex: 1; overflow-y: auto;
    background: #fff; border: 3px solid var(--blue);
    border-radius: 12px; padding: 12px;
    text-align: left;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 6px;
    min-height: 220px;
  }
  .lobby-team {
    background: var(--cream); border-left: 4px solid var(--red);
    padding: 8px 12px; border-radius: 6px;
    font-size: 14px; font-weight: 900; letter-spacing: 1px;
    color: var(--blue-dark);
    animation: slidein .25s ease;
  }
  @keyframes slidein {
    from { transform: translateX(-12px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .lobby-teams .empty {
    grid-column: 1 / -1;
    text-align: center; color: var(--blue);
    font-size: 16px; letter-spacing: 2px;
    padding: 40px 0;
  }
  .lobby-actions {
    display: flex; gap: 12px; justify-content: center;
    margin-top: 18px;
  }

  /* ROUND INTRO */
  .round-intro { padding: 40px; }
  .round-label {
    font-size: 48px; letter-spacing: 18px; color: var(--cream);
    text-shadow: 3px 3px 0 var(--blue); margin-bottom: 8px;
  }
  .round-number {
    font-size: 220px; line-height: 1; color: var(--yellow);
    text-shadow:
      6px 6px 0 var(--red), 12px 12px 0 var(--blue), 18px 18px 0 var(--black);
    margin: 0;
  }
  .round-category {
    font-size: 84px; color: var(--red);
    text-shadow: 4px 4px 0 var(--yellow), 8px 8px 0 var(--black);
    margin: 16px 0 8px; letter-spacing: 6px;
  }
  .round-count {
    font-size: 26px; color: var(--cream);
    letter-spacing: 4px; margin-bottom: 32px;
  }

  /* QUESTION SCREEN (host) */
  .q-screen-host {
    display: grid; grid-template-columns: 1.5fr 1fr; grid-template-rows: auto 1fr auto;
    gap: 18px; height: 100%; align-content: stretch;
    grid-template-areas:
      "top top"
      "qtext tracker"
      "footer footer";
  }
  .q-topbar {
    grid-area: top;
    display: flex; justify-content: flex-start; align-items: center; gap: 24px;
  }
  .q-badge {
    background: var(--blue); border: 5px solid var(--black);
    border-radius: 14px; padding: 14px 32px;
    font-size: 38px; letter-spacing: 4px; color: var(--yellow);
    text-shadow: 3px 3px 0 var(--black);
  }
  /* Brand logo in the top-left of each question (in the top bar, left of the badge). */
  .q-corner-logo { height: 64px; max-width: 220px; object-fit: contain; display: block; }
  .q-category {
    /* Sits at the right end of the top bar (same row as the Q-badge), above the
       tracker — flows in the layout so it never overlaps the submissions box. */
    margin-left: auto;
    background: var(--red); border: 5px solid var(--black);
    border-radius: 14px; padding: 14px 32px;
    font-size: 38px; letter-spacing: 4px; color: var(--yellow);
    text-shadow: 3px 3px 0 var(--black);
  }
  .q-text {
    grid-area: qtext;
    font-size: 52px; line-height: 1.2; color: var(--cream);
    background: linear-gradient(180deg, var(--blue-dark), #0a1234);
    border: 5px solid var(--yellow); border-radius: 22px;
    padding: 36px 50px; box-shadow: var(--shadow);
    letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .q-text .q-num {
    display: inline-block; background: var(--yellow); color: var(--red);
    border: 3px solid var(--black); border-radius: 12px;
    padding: 4px 18px; margin-right: 18px; font-size: 44px;
    vertical-align: middle; text-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }
  .q-footer {
    grid-area: footer; text-align: center;
  }
  .q-reveal-note {
    position: fixed;
    bottom: 80px; left: 0; right: 0;
    text-align: center;
    font-size: 36px; letter-spacing: 5px;
    color: #ffffff; font-weight: 900;
    text-shadow: 3px 3px 0 var(--red), 6px 6px 0 var(--black);
    z-index: 12;
    pointer-events: none;
  }

  /* SUBMISSION TRACKER (no answer text) */
  .tracker {
    grid-area: tracker;
    background: var(--cream); border: 5px solid var(--blue);
    border-radius: 18px; padding: 16px;
    box-shadow: var(--shadow); color: var(--blue-dark);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .tracker h3 {
    margin: 0 0 8px; color: var(--red);
    font-size: 22px; letter-spacing: 3px; text-align: center;
    text-shadow: 2px 2px 0 var(--yellow);
  }
  .tracker .stat {
    text-align: center; color: var(--blue);
    font-size: 36px; font-weight: 900; letter-spacing: 2px;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 var(--yellow);
  }
  .tracker .stat b { color: var(--red); }
  .tracker-grid {
    flex: 1; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 6px;
  }
  .tracker-cell {
    background: #fff; border: 2px solid var(--blue);
    border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-weight: 900; letter-spacing: 1px;
    color: var(--blue-dark);
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px;
    transition: background .3s, border-color .3s, transform .2s;
  }
  .tracker-cell.submitted {
    background: linear-gradient(180deg, var(--yellow-bright), var(--yellow));
    border-color: var(--red); color: var(--red);
    transform: scale(1.02);
  }
  .tracker-cell .check { font-size: 16px; }

  /* ROUND-END Q+A LIST */
  .round-end-answers {
    display: flex; flex-direction: column;
    height: 100%; max-height: calc(100vh - 200px);
    gap: 14px; text-align: center;
  }
  .round-end-header h2 {
    font-size: 56px; margin: 0 0 4px;
    color: var(--red); letter-spacing: 4px;
    text-shadow: 6px 6px 0 var(--yellow), 12px 12px 0 var(--blue), 18px 18px 0 var(--black);
  }
  .round-end-answers .round-category {
    font-size: 36px; margin: 0;
    text-shadow: 3px 3px 0 var(--yellow), 5px 5px 0 var(--black);
  }
  .qa-list {
    flex: 1; overflow: auto;
    background: var(--cream); border: 5px solid var(--blue);
    border-radius: 18px; padding: 18px 26px;
    box-shadow: var(--shadow);
    text-align: left; color: var(--blue-dark);
  }
  .qa-list ol {
    list-style: none; margin: 0; padding: 0;
    columns: 2; column-gap: 40px;
    column-rule: 2px dashed rgba(29,58,138,.25);
    height: 100%;
  }
  .qa-item {
    break-inside: avoid; padding: 6px 0;
    border-bottom: 1px dashed rgba(29,58,138,.15);
  }
  .qa-item:last-child { border-bottom: 0; }
  .qa-q { font-weight: 900; color: var(--blue-dark); line-height: 1.25; }
  .qa-num { display: inline-block; color: var(--red); margin-right: 8px; font-weight: 900; }
  .qa-a { color: var(--red); margin-top: 2px; line-height: 1.2; padding-left: 4px; }
  .qa-a b { color: var(--blue); letter-spacing: 1px; margin-right: 4px; font-size: .85em; }

  /* MODAL */

  /* ---- BUILD-YOUR-OWN sheet ---- */

    background: rgba(29,58,138,.07); border: 2px solid rgba(29,58,138,.25); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
  .bld-num { display: flex; flex-direction: column; }

  .bld-qn { width: 28px; text-align: right; font-weight: 900; color: var(--blue); flex: 0 0 auto; }
  .modal input[type="text"].bld-catname { flex: 1; padding: 10px 12px; font-size: 18px; }

  .format-help { background: rgba(29,58,138,.08); border-left: 4px solid var(--blue); padding: 10px 14px; margin: 0 0 10px; font-size: 12px; font-family: ui-monospace, "Consolas", monospace; color: var(--blue-dark); white-space: pre; overflow-x: auto; border-radius: 0 6px 6px 0; }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 22px; padding-top: 18px; border-top: 2px solid rgba(29,58,138,.2); }

  /* Make modal body text readable — override the display font (Impact) for forms,

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

// Forgiving text-format parser. Accepts:
//   Headers: # / ## / ### Category Name
//   Separators (between question and answer): | , :: , — , – , " - "
//   List prefixes (stripped): "1. ", "2) ", "- ", "* ", "• "
//   Markdown emphasis (stripped): **bold**, __bold__, *italic*, _italic_
//   Horizontal rules ignored: ---, ***, ___
function parseTextRounds(text) {
  const lines = text.split(/\r?\n/);
  const rounds = []; let current = null;
  const SEPS = [" :: ", " — ", " – ", " | ", " - ", "|", "::"];
  for (const raw of lines) {
    let line = raw.trim();
    if (!line) continue;
    if (/^[-*_=]{3,}$/.test(line)) continue;  // horizontal rules

    // Category headers: # to ######
    const catMatch = line.match(/^#{1,6}\s+(.+)$/);
    if (catMatch) {
      const name = catMatch[1].replace(/[*_]+/g, "").trim();
      if (name) { current = { category: name, questions: [] }; rounds.push(current); }
      continue;
    }
    // Auto-create a default category if none was specified
    if (!current) { current = { category: "Trivia", questions: [] }; rounds.push(current); }

    line = line.replace(/^\d+\s*[.)\]:]\s+/, "").replace(/^[-*•]\s+/, "");

    line = line.replace(/\*\*(.+?)\*\*/g, "$1")
               .replace(/__(.+?)__/g, "$1")
               .replace(/\*(.+?)\*/g, "$1")
               .replace(/_(.+?)_/g, "$1");

    // Split on the first separator that appears
    let q = line, a = "";
    for (const sep of SEPS) {
      const idx = line.indexOf(sep);
      if (idx > 0) { q = line.substring(0, idx).trim(); a = line.substring(idx + sep.length).trim(); break; }
    }
    if (q) current.questions.push({ q, a });

    // Fill in QR if room exists; otherwise kick off room creation
    if (game.roomCode) {
      const joinUrl = `${location.origin}${location.pathname}?join=${game.roomCode}`;
      const qrBox = document.getElementById("instrQR");
      if (qrBox) {
        qrBox.innerHTML = "";
        try {
          new QRCode(qrBox, {
            text: joinUrl,
            width: 184, height: 184,
            colorDark: "#0c0c0c", colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M,
          });
        } catch (e) { console.warn("Title QR render failed:", e); }
      }
    } else {
      ensureRoom();
    }
  }

  let creatingRoom = false;
  async function ensureRoom() {
    if (game.roomCode || creatingRoom) return;
    creatingRoom = true;
    try {
      await ensureAuth();
      let code = genRoomCode();
      const ref = doc(db, "rooms", code);
      const existing = await getDoc(ref);
      if (existing.exists()) code = genRoomCode();
      const ref2 = doc(db, "rooms", code);
      await setDoc(ref2, {
        state: "lobby",
        roundIdx: 0,
        questionIdx: 0,
        currentCategory: "",
        currentQuestion: "",
        totalRounds: ROUNDS.length,
        createdAt: serverTimestamp(),
        hostUid: auth.currentUser.uid,
      });
      game.roomCode = code;
      roomRef = ref2;
      unsubTeams = onSnapshot(collection(db, "rooms", code, "teams"), (snap) => {
        const teams = {};
        snap.forEach(d => { teams[d.id] = d.data(); });
        game.teams = teams;
        if (game.state === State.TITLE) {
          // Update count in instructions card silently — full re-render not needed
          const codeEl = document.querySelector(".instr-qr-code");
          if (codeEl && game.roomCode) codeEl.textContent = game.roomCode;
        }
        if (game.state === State.LOBBY) renderLobbyTeams();
        if (game.state === State.QUESTION) renderTracker();
        renderWinnerBanner();
      });
      unsubSubs = onSnapshot(collection(db, "rooms", code, "submissions"), (snap) => {
        const subs = {};
        snap.forEach(d => { subs[d.id] = d.data(); });
        game.submissions = subs;
        if (game.state === State.QUESTION) renderTracker();
        renderWinnerBanner();
      });
      // Re-render the current screen to fill in the QR
      render();
    } catch (err) {
      console.error("Failed to create room:", err);
      const codeEl = document.querySelector(".instr-qr-code");
      if (codeEl) codeEl.textContent = "ERROR";
      const qrBox = document.getElementById("instrQR");
      if (qrBox) qrBox.innerHTML = `<div class="qr-loading" style="color:var(--red);">FIREBASE<br/>NOT READY</div>`;
    } finally {
      creatingRoom = false;
    }
  }

  async function fetchGeminiTopic(topic, count, apiKey) {
    const prompt =
      `Generate exactly ${count} distinct trivia questions about "${topic}". ` +
      `Return ONLY a JSON array of ${count} objects, each with "q" (the question) and "a" (the answer). ` +
      `Keep questions short. Answers should be brief — usually 1-4 words.`;
    // Try multiple models in order. Use JSON-mode output for reliable parsing.
    // Order: lite variants first (1000 RPD), then flagships (200-250 RPD).
    const models = ["gemini-2.5-flash-lite", "gemini-2.5-flash", "gemini-2.0-flash-lite", "gemini-2.0-flash"];
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    let lastErr = "no models tried";
    for (const model of models) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
      try {
        const body = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            temperature: 0.8,
            maxOutputTokens: 4096,
            responseMimeType: "application/json",
            responseSchema: {
              type: "ARRAY",
              minItems: count,
              maxItems: count,
              items: {
                type: "OBJECT",
                properties: {
                  q: { type: "STRING" },
                  a: { type: "STRING" },
                },
                required: ["q", "a"],
              },
            },
          },
        };
        // Disable thinking budget on 2.5 so all tokens go to actual output
        if (model.startsWith("gemini-2.5")) {
          body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
        }
        const resp = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const errText = await resp.text().catch(() => "");
          lastErr = `${model}: HTTP ${resp.status} — ${errText.slice(0, 220)}`;
          console.warn("Gemini try failed:", lastErr);
          // 503 = overloaded (transient) — retry same model once after a short wait
          if (resp.status === 503) {
            await sleep(2000);
            const retry = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
              body: JSON.stringify(body),
            });
            if (retry.ok) {
              const data = await retry.json();
              const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
              if (text) {
                try {
                  const parsed = JSON.parse(text);
                  if (Array.isArray(parsed)) {
                    const qs = parsed.filter(o => o && typeof o.q === "string" && typeof o.a === "string" && o.q.trim() && o.a.trim())
                                     .map(o => ({ q: o.q.trim(), a: o.a.trim() })).slice(0, count);
                    if (qs.length >= Math.max(1, Math.floor(count / 2))) return qs;
                  }
                } catch {}
              }
            }
          }
          continue;
        }
        const data = await resp.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
        if (!text) { lastErr = `${model}: empty response`; continue; }
        let parsed;
        try { parsed = JSON.parse(text); }
        catch (e) {
          // If JSON mode wasn't supported, fall back to text parsing
          const fallback = parseAILines(text, count);
          if (fallback.length >= Math.max(1, Math.floor(count / 2))) return fallback;
          lastErr = `${model}: JSON parse failed (${e.message})`;
          continue;
        }
        if (!Array.isArray(parsed)) { lastErr = `${model}: response not an array`; continue; }
        const qs = parsed
          .filter(o => o && typeof o.q === "string" && typeof o.a === "string" && o.q.trim() && o.a.trim())
          .map(o => ({ q: o.q.trim(), a: o.a.trim() }))
          .slice(0, count);
        if (qs.length < Math.max(1, Math.floor(count / 2))) {
          lastErr = `${model}: only got ${qs.length}/${count} valid items`;
          continue;
        }
        return qs;
      } catch (e) {
        lastErr = `${model}: ${e.message}`;
        console.warn("Gemini try error:", lastErr);
      }
    }
    throw new Error(lastErr);
  }

  // AI question generation via Pollinations.ai (free, no API key, browser-friendly).
  // Cycles through multiple models on rate-limit, then retries with backoff.
  async function fetchPollinationsTopic(topic, count) {
    const prompt =
      `Generate exactly ${count} short trivia questions about "${topic}". ` +
      `Each on its own line, format strictly: Question? | Answer. ` +
      `No numbering, no introduction, no commentary, just ${count} lines.`;
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // Try a sequence of Pollinations models — if one is rate-limited, the next may work
    const variants = [
      { url: `https://text.pollinations.ai/${encodeURIComponent(prompt)}` },
      { url: `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=mistral` },
      { url: `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai-fast` },
      { url: `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=deepseek` },
      { url: `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=llamalight` },
      {
        url: "https://text.pollinations.ai/",
        post: { messages: [{ role: "user", content: prompt }] },
      },
    ];

    let lastErr = "";
    for (let attempt = 0; attempt < variants.length * 2; attempt++) {
      const v = variants[attempt % variants.length];
      try {
        const resp = await fetch(v.url, v.post
          ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(v.post) }
          : undefined);
        if (resp.status === 429) {
          lastErr = "rate-limited";
          await sleep(1500 + 700 * attempt);
          continue;
        }
        if (!resp.ok) {
          lastErr = `HTTP ${resp.status}`;
          await sleep(800);
          continue;
        }
        const text = await resp.text();
        const qs = parseAILines(text, count);
        if (qs.length > 0) return qs;
        lastErr = "no usable lines";
        await sleep(800);
      } catch (e) {
        lastErr = e.message;
        await sleep(800);
      }
    }
    throw new Error(`AI busy (${lastErr})`);
  }

  function renderAIFailedRecovery(failedTopics, aiResults) {
    // Build per-topic error display. aiResults aligns with the original aiTopics order,
    // not failedTopics, so look up each error by topic name.
    const errByTopic = new Map();
    aiResults.forEach(r => { if (r && r.__error) errByTopic.set(r.topic, r.__error); });
    const items = failedTopics.map(t => {
      const errMsg = errByTopic.get(t) || "unknown error";
      return `
        <div style="margin-top:8px;padding-bottom:8px;border-bottom:1px dashed rgba(29,58,138,.2);">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="flex:1;min-width:160px;">🤖 <b>${escapeHtml(t)}</b></span>
            <button class="manual-save" data-switch="${escapeHtml(t)}" style="background:var(--red);">📝 SWITCH TO MANUAL</button>
          </div>
          <div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--blue-dark);margin-top:4px;word-break:break-word;background:#fff;padding:6px 10px;border-radius:6px;">
            ${escapeHtml(errMsg)}
          </div>
        </div>
      `;
    }).join("");
    return `
      <div class="error-msg" style="text-align:left;">
        AI failed. Below is the actual error from the API per topic — share with me if unclear, or switch to manual.
      </div>
      <div style="background:rgba(29,58,138,.08);border:2px solid var(--blue);border-radius:8px;padding:10px 14px;margin-top:6px;">
        ${items}
      </div>

    if (msg) msg.innerHTML = "";

  function parseAILines(text, count) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const qs = [];
    for (const raw of lines) {
      let line = raw.replace(/^\d+[\.)\]:]\s*/, "")
                    .replace(/^[-*•]\s*/, "")
                    .replace(/\*\*([^*]+)\*\*/g, "$1")
                    .replace(/^Q:\s*/i, "")
                    .replace(/^Question:\s*/i, "");
      const sep = line.match(/^(.*?)\s*(?:\||::|—|–|\s-\s)\s*(.+)$/);
      if (!sep) continue;
      const q = sep[1].trim(), a = sep[2].trim().replace(/^A:\s*/i, "").replace(/^Answer:\s*/i, "");
      if (q && a) qs.push({ q, a });
      if (qs.length >= count) break;
    }
    return qs;
  }

  async function runRandomGenerate() {
    const msg = document.getElementById("randomMsg");
    const cats = [...randomConfig.categories];
    // Split custom topics by mode: manual (has stored questions) vs AI (null value)
    const customEntries = [...randomConfig.customTopics.entries()];
    const aiTopics = customEntries.filter(([_, qs]) => qs === null).map(([t]) => t);
    const manualEntries = customEntries.filter(([_, qs]) => Array.isArray(qs));
    if (cats.length === 0 && customEntries.length === 0) {
      msg.innerHTML = `<div class="error-msg">Pick at least one category or add a custom topic.</div>`;
      return;
    }
    const goBtn = document.getElementById("randomGoBtn");
    goBtn.disabled = true; goBtn.textContent = "FETCHING…";
    const decode = (s) => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const amount = randomConfig.questionsPerRound;
    const diffParam = randomConfig.difficulty === "any" ? "" : `&difficulty=${randomConfig.difficulty}`;

    async function fetchCat(catId, catName) {
      for (let attempt = 0; attempt < 4; attempt++) {
        try {
          const url = `https://opentdb.com/api.php?amount=${amount}&category=${catId}&type=multiple${diffParam}`;
          const resp = await fetch(url);
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const data = await resp.json();
          if (data.response_code === 0) return data.results;
          if (data.response_code === 5 || data.response_code === 1) {
            await sleep(1800 + 1200 * attempt);
            continue;
          }
          throw new Error("API code " + data.response_code);
        } catch (e) {
          if (attempt === 3) throw new Error(`${catName}: ${e.message}`);
          await sleep(1500);
        }
      }
      throw new Error(`Gave up on ${catName}`);
    }

    try {
      const catObjs = cats.map(id => OTDB_CATEGORIES.find(c => c.id === id)).filter(Boolean);
      // Run OpenTDB fetches and AI fetches in parallel. Manual topics need no fetch.
      const otdbPromise = Promise.all(catObjs.map(c => fetchCat(c.id, c.name)));
      const aiPromise = Promise.all(aiTopics.map(t => fetchAITopic(t, amount).catch(e => ({ __error: e.message, topic: t }))));
      const [otdbResults, aiResults] = await Promise.all([otdbPromise, aiPromise]);

      const rounds = [];
      catObjs.forEach((c, i) => {
        rounds.push({
          category: c.name,
          questions: otdbResults[i].map(q => ({
            q: decode(q.question),
            a: decode(q.correct_answer),
          })),
        });
      });
      const aiErrors = [];
      aiTopics.forEach((topic, i) => {
        const result = aiResults[i];
        if (result && result.__error) { aiErrors.push(`"${topic}": ${result.__error}`); return; }
        rounds.push({ category: topic, questions: result });
      });
      // Manual topics — use the questions the user already typed in
      manualEntries.forEach(([topic, qs]) => {
        rounds.push({ category: topic, questions: qs });
      });

      // If every selected topic was AI and they all failed, surface a per-topic
      // recovery UI: a button per failed topic that opens the manual panel pre-filled.
      const failedTopics = aiTopics.filter((t, i) => aiResults[i] && aiResults[i].__error);
      if (rounds.length === 0 && failedTopics.length > 0) {
        msg.innerHTML = renderAIFailedRecovery(failedTopics, aiResults);
        // Wire each "Switch to Manual" button
        msg.querySelectorAll("button[data-switch]").forEach(btn => {
          btn.addEventListener("click", () => switchTopicToManual(btn.dataset.switch));
        });
        return;
      }
      if (rounds.length === 0) throw new Error("No questions could be fetched. " + aiErrors.join(" "));
      saveRoundsToStorage(rounds);
      ROUNDS = rounds;
      closeRandomModal();
      render();
      if (aiErrors.length) {
        // Soft warning — game still works for fetched rounds
        console.warn("Some AI topics failed:", aiErrors);
      }
    } catch (err) {
      console.error("Random pack fetch failed:", err);
      msg.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
    } finally {
      if (goBtn) { goBtn.disabled = false; goBtn.textContent = "🎲 GENERATE"; }
    }
  }

  // Auto-grade submissions against q.a (normalize + fuzzy match) and tally per team.
  function computeScores() {
    const scores = {};
    for (const [uid, team] of Object.entries(game.teams)) {
      scores[uid] = { name: team.name || "Team", correct: 0 };
    }
    for (const sub of Object.values(game.submissions)) {
      const round = ROUNDS[sub.roundIdx];
      if (!round) continue;
      const q = round.questions[sub.questionIdx];
      if (!q) continue;
      if (isAcceptable(sub.answer, q)) {
        if (!scores[sub.teamId]) {
          scores[sub.teamId] = { name: sub.teamName || "Team", correct: 0 };
        }
        scores[sub.teamId].correct++;
      }
    }
    return scores;
  }

  function renderWinnerBanner() {
    const banner = document.getElementById("winnerBanner");
    if (!banner) return;
    // Hide on title and lobby — no submissions yet.
    if (game.state === State.TITLE || game.state === State.LOBBY) {
      banner.classList.remove("show"); banner.innerHTML = ""; return;
    }
    const allScores = Object.values(computeScores()).filter(s => s.correct > 0);
    if (allScores.length === 0) {
      banner.classList.remove("show"); banner.innerHTML = ""; return;
    }
    allScores.sort((a, b) => b.correct - a.correct);
    const topCount = allScores[0].correct;
    const leaders = allScores.filter(s => s.correct === topCount);
    const label = leaders.length > 1 ? `${leaders.length}-WAY TIE` : "WINNING TEAM";
    const names = leaders.map(s => s.name).join(" · ");
    banner.innerHTML = `
      <span class="wb-trophy">🏆</span>
      <span class="wb-label">${label}</span>
      <span class="wb-name">${escapeHtml(names)}</span>
      <span class="wb-score">${topCount}</span>

  async function syncRoomState() {
    if (!roomRef) return;
    // Phones see "lobby" while host is on title — teams can join early.
    const roomState = (game.state === State.TITLE) ? "lobby" : game.state;
    const update = {
      state: roomState,
      roundIdx: game.roundIdx,
      questionIdx: game.questionIdx,
    };
    if (game.state === State.QUESTION) {
      const round = ROUNDS[game.roundIdx];
      const q = round.questions[game.questionIdx];
      update.currentQuestion = (typeof q === "string" ? q : q.q) || "";
      update.currentCategory = round.category || "";
    } else if (game.state === State.ROUND_INTRO) {
      update.currentCategory = ROUNDS[game.roundIdx]?.category || "";
      update.currentQuestion = "";
    } else {
      update.currentQuestion = "";
    }
    try { await updateDoc(roomRef, update); }
    catch (e) { console.warn("Room sync failed:", e); }

  function advance() {
    switch (game.state) {
      case State.TITLE: return; // handled by startBtn
      case State.LOBBY:
        game.state = State.ROUND_INTRO;
        game.roundIdx = 0; game.questionIdx = 0;
        break;
      case State.ROUND_INTRO:
        game.state = State.QUESTION; game.questionIdx = 0; break;
      case State.QUESTION: {
        const round = ROUNDS[game.roundIdx];
        if (game.questionIdx < round.questions.length - 1) game.questionIdx++;
        else game.state = State.ROUND_END;
        break;
      }
      case State.ROUND_END:
        if (game.roundIdx < ROUNDS.length - 1) {
          game.roundIdx++; game.questionIdx = 0;
          game.state = State.ROUND_INTRO;
        } else game.state = State.END;
        break;
    }
    render();
  }
  function goBack() {
    switch (game.state) {
      case State.QUESTION:
        if (game.questionIdx > 0) game.questionIdx--;
        else game.state = State.ROUND_INTRO;
        break;
      case State.ROUND_END:
        game.state = State.QUESTION;
        game.questionIdx = ROUNDS[game.roundIdx].questions.length - 1;
        break;
      case State.ROUND_INTRO:
        if (game.roundIdx > 0) { game.roundIdx--; game.state = State.ROUND_END; }
        else game.state = State.LOBBY;
        break;
      case State.END:
        game.state = State.ROUND_END;
        game.roundIdx = ROUNDS.length - 1; break;
    }
    render();
  }

      return;
    }
    if (e.target.matches("input, textarea")) return;
    switch (e.key) {
      case " ": case "ArrowRight": case "Enter":
        e.preventDefault();
        if (game.state === State.TITLE) startNewRoom();

  }
  function collectBuilderRounds() {
    readBuilderDOM();
    const rounds = (BUILDER_DATA || []).map(c => ({
      category: (c.category || "").trim(),
      questions: (c.questions || []).map(q => ({ q: (q.q || "").trim(), a: (q.a || "").trim() })).filter(q => q.q)
    })).filter(c => c.category || c.questions.length);
    if (!rounds.length) throw new Error("Add at least one category with one question.");
    for (const c of rounds) {
      if (!c.category) throw new Error("Every category needs a name.");
      if (!c.questions.length) throw new Error('Category "' + c.category + '" needs at least one question.');
    }
    return rounds;
  }
  // Toggle the builder grid vs the upload/paste area based on the active tab.
  function setModalMode() {
    const build = modalFormat === "build";
    const ua = document.getElementById("uploadArea"), ba = document.getElementById("builderArea"), fh = document.getElementById("formatHelp");
    if (ua) ua.style.display = build ? "none" : "";
    if (fh) fh.style.display = build ? "none" : "";
    if (ba) ba.style.display = build ? "" : "none";
    if (build) {
      const grid = document.getElementById("builderGrid");
      if (grid && !grid.children.length) { if (!BUILDER_DATA) seedBuilderData(); renderBuilder(); }
    }
  }

  function openLoadModal() {
    document.getElementById("modalRoot").innerHTML = `
      <div class="modal-backdrop" id="loadModal">
        <div class="modal" role="dialog">
          <button class="close-x" id="closeX">×</button>
          <h2>LOAD QUESTIONS</h2>
          <p class="modal-lead"><b>Build your own</b> sheet below — set how many categories &amp; questions, then type them in. Or switch tabs to paste / upload a file (Plain Text, CSV, JSON).</p>
          <div class="format-tabs">
            <button class="format-tab ${modalFormat === "build" ? "active" : ""}" data-fmt="build">BUILD YOUR OWN</button>
            <button class="format-tab ${modalFormat === "text" ? "active" : ""}" data-fmt="text">PLAIN TEXT</button>
            <button class="format-tab ${modalFormat === "csv" ? "active" : ""}" data-fmt="csv">CSV</button>
            <button class="format-tab ${modalFormat === "json" ? "active" : ""}" data-fmt="json">JSON</button>
          </div>
          <div class="format-help" id="formatHelp"></div>
          <div id="msgArea"></div>

          <div id="builderArea">
            <div class="bld-controls">
              <div class="bld-num"><label for="bldCats">CATEGORIES</label><input type="number" id="bldCats" min="1" max="40" value="5" /></div>
              <div class="bld-num"><label for="bldQs">QUESTIONS&nbsp;EACH</label><input type="number" id="bldQs" min="1" max="100" value="10" /></div>
              <button class="btn secondary" id="bldResize" type="button">CREATE / RESIZE SHEET</button>
              <div class="bld-total" id="bldTotal"></div>
            </div>
            <div id="builderGrid"></div>
          </div>

          <div id="uploadArea">
            <div class="field">
              <label>OPTIONAL — CHUNK FLAT LIST INTO ROUNDS</label>
              <div class="size-row">
                <label style="color:var(--blue);width:auto;margin:0;">ROUNDS</label>
                <input type="number" id="loadRounds" min="0" max="20" value="0" />
                <label style="color:var(--blue);width:auto;margin:0;">×</label>
                <label style="color:var(--blue);width:auto;margin:0;">QUESTIONS / ROUND</label>
                <input type="number" id="loadPerRound" min="0" max="50" value="0" />
                <span style="font-size:12px;color:var(--blue);">(leave 0 to use ## headers / CSV categories)</span>
              </div>
            </div>
            <div class="field">
              <label>UPLOAD A FILE (.txt, .csv, OR .json)</label>
              <input type="file" id="fileInput" accept=".txt,.csv,.json,text/plain,text/csv,application/json" />
            </div>
            <div class="field">
              <label>OR PASTE YOUR QUESTIONS</label>
              <textarea id="pasteArea" placeholder="Paste your questions here..."></textarea>
            </div>
          </div>

          <div class="modal-actions">
            <button class="btn danger" id="resetBtn">RESET TO DEFAULT</button>
            <button class="btn secondary" id="cancelBtn">CANCEL</button>
            <button class="btn" id="applyBtn">APPLY</button>
          </div>
        </div>
      </div>
    `;
    updateFormatHelp();
    setModalMode();
    document.getElementById("closeX").addEventListener("click", closeLoadModal);
    document.getElementById("cancelBtn").addEventListener("click", closeLoadModal);
    document.getElementById("applyBtn").addEventListener("click", applyFromModal);
    document.getElementById("resetBtn").addEventListener("click", () => {
      clearStoredRounds(); ROUNDS = DEFAULT_ROUNDS.slice(); BUILDER_DATA = null;
      closeLoadModal(); render();
    });
    document.getElementById("fileInput").addEventListener("change", handleFilePicked);
    document.getElementById("bldResize").addEventListener("click", resizeBuilder);
    document.querySelectorAll(".format-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        modalFormat = tab.dataset.fmt;
        document.querySelectorAll(".format-tab").forEach(t => t.classList.toggle("active", t === tab));
        updateFormatHelp();
        setModalMode();
      });
    });
    document.getElementById("loadModal").addEventListener("click", (e) => {
      if (e.target.id === "loadModal") closeLoadModal();
    });
  }
  function closeLoadModal() { document.getElementById("modalRoot").innerHTML = ""; }
  function updateFormatHelp() {
    const el = document.getElementById("formatHelp"); if (!el) return;
    if (modalFormat === "text") {
      el.textContent =
        "Just paste a list:\n\nQuestion? | Answer\nQuestion? | Answer\nQuestion? — Answer\n\nOptional: group into rounds with category headers:\n\n## Food & Drink\nQuestion? | Answer\n## Sports\nQuestion? | Answer\n\n(Separators: | :: — – or \" - \". Lists / bold / numbered all OK.)";
    } else if (modalFormat === "csv") {
      el.textContent =
        "Category,Question,Answer\nSports,How many players on a soccer team?,11\n" +
        'Sports,"What sport uses ""love"" for zero?",Tennis\nMusic,Who is the King of Pop?,Michael Jackson\n\n' +
        "(One question per row: Category, Question, Answer. Header row optional; answer optional.\n Wrap a field in quotes if it has a comma. Exports straight from Excel/Google Sheets.)";
    } else {
      el.textContent =
        '[\n  {\n    "category": "Sports",\n    "questions": [\n      { "q": "Players on a soccer team?", "a": "11" },\n      { "q": "Sport that uses \'love\' for zero?", "a": "Tennis" }\n    ]\n  }\n]';
    }
  }
  function showModalMsg(text, type) {
    const el = document.getElementById("msgArea"); if (!el) return;
    el.innerHTML = `<div class="${type === "ok" ? "ok-msg" : "error-msg"}">${escapeHtml(text)}</div>`;
  }
  function handleFilePicked(e) {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById("pasteArea").value = ev.target.result;
      if (file.name.toLowerCase().endsWith(".json")) modalFormat = "json";
      else if (file.name.toLowerCase().endsWith(".csv")) modalFormat = "csv";
      else if (file.name.toLowerCase().endsWith(".txt")) modalFormat = "text";
      document.querySelectorAll(".format-tab").forEach(t => t.classList.toggle("active", t.dataset.fmt === modalFormat));
      updateFormatHelp();
      setModalMode();
      showModalMsg(`Loaded "${file.name}". Click APPLY to use.`, "ok");
    };
    reader.onerror = () => showModalMsg("Could not read that file.", "err");
    reader.readAsText(file);
  }
  function applyFromModal() {
    // BUILD tab: collect the grid instead of parsing pasted text.
    if (modalFormat === "build") {
      try {
        const parsed = normalizeRounds(collectBuilderRounds());
        validateRounds(parsed);
        saveRoundsToStorage(parsed); ROUNDS = parsed;
        const total = parsed.reduce((n, r) => n + r.questions.length, 0);
        showModalMsg("Built " + parsed.length + " categories, " + total + " questions.", "ok");
        setTimeout(() => { closeLoadModal(); render(); }, 600);
      } catch (err) { showModalMsg("Could not build: " + err.message, "err"); }
      return;
    }
    const text = document.getElementById("pasteArea").value.trim();
    if (!text) { showModalMsg("Paste questions or pick a file first.", "err"); return; }
    const rounds = parseInt(document.getElementById("loadRounds")?.value, 10) || 0;
    const perRound = parseInt(document.getElementById("loadPerRound")?.value, 10) || 0;
    try {
      let parsed;
      if (modalFormat === "json") parsed = parseJsonRounds(text);
      else if (modalFormat === "csv") parsed = parseCsvRounds(text);
      else if (text.startsWith("[") || text.startsWith("{")) {
        try { parsed = parseJsonRounds(text); } catch { parsed = parseTextRounds(text); }
      } else parsed = parseTextRounds(text);
      // Optional re-chunk: if user filled in rounds & perRound AND there's only one
      // big category (no ## headers found), split into N rounds of M.
      if (rounds > 0 && perRound > 0 && parsed.length === 1) {
        const all = parsed[0].questions;
        const need = rounds * perRound;
        if (all.length < need) {
          showModalMsg(`Need ${need} questions for ${rounds}×${perRound}; only ${all.length} provided.`, "err");
          return;
        }
        const chunked = [];
        for (let r = 0; r < rounds; r++) {
          chunked.push({
            category: `Round ${r + 1}`,
            questions: all.slice(r * perRound, (r + 1) * perRound),
          });
        }
        parsed = chunked;
      }
      saveRoundsToStorage(parsed); ROUNDS = parsed;
      const total = parsed.reduce((n, r) => n + r.questions.length, 0);
      showModalMsg(`Loaded ${parsed.length} categories, ${total} questions.`, "ok");
      setTimeout(() => { closeLoadModal(); render(); }, 600);
    } catch (err) {
      showModalMsg("Could not load: " + err.message, "err");
    }
  }

  // Wire the global BACK button once
  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.addEventListener("click", () => goBack());

  // BOOT (host)
  render();
})();

// ============================================================
// PHONE MODE
// ============================================================
if (MODE === "phone") (async function phoneMain() {
  // Hide footer kbd hints on phone
  document.getElementById("footerControls").innerHTML = `<span>ROOM <kbd>${escapeHtml(JOIN_CODE)}</kbd></span>`;
  document.getElementById("footerNote").textContent = "TYPE YOUR ANSWER · SUBMIT ON YOUR PHONE";

  let user = null;
  let roomData = null;
  let teamName = localStorage.getItem("tw-team-name") || "";
  let lastQKey = "";
  let submittedKey = "";
  let hasJoined = false; // true only after the user clicks JOIN for THIS room
  let lastRenderKey = ""; // skips redundant re-renders during snapshot churn

  function setMeta(text) { getMeta().innerHTML = text ? `<div class="chip">${text}</div>` : ""; }

  function renderError(msg) {
    getMain().innerHTML = `
      <div class="view">
        <div class="phone-screen">
          <h2>OOPS</h2>
          <div class="phone-error">${escapeHtml(msg)}</div>
          <p>Check the room code on the main screen and try again.</p>
        </div>
      </div>
    `;
  }

  function renderNameEntry() {
    setMeta(`ROOM ${JOIN_CODE}`);
    getMain().innerHTML = `
      <div class="view">
        <div class="phone-screen pop">
          <h2>JOIN ROOM ${escapeHtml(JOIN_CODE)}</h2>
          <p>Pick a team name. Everyone on your team should see this on one phone.</p>
          <input class="phone-input" id="nameInput" type="text" maxlength="24" placeholder="e.g. Wing Squad" value="${escapeHtml(teamName)}" />
          <button class="phone-btn" id="joinBtn">JOIN GAME</button>
        </div>
      </div>
    `;
    const input = document.getElementById("nameInput");
    input.focus();
    document.getElementById("joinBtn").addEventListener("click", join);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
  }

  async function join() {
    const input = document.getElementById("nameInput");
    const name = (input?.value || "").trim();
    if (!name) { input.focus(); return; }
    teamName = name;
    localStorage.setItem("tw-team-name", name);
    document.getElementById("joinBtn").disabled = true;
    try {
      await setDoc(doc(db, "rooms", JOIN_CODE, "teams", user.uid), {
        name, joinedAt: serverTimestamp(), uid: user.uid,
      });
      hasJoined = true;
      renderForState();
    } catch (e) {
      console.error(e);
      renderError("Could not join the room. Try again.");
    }
  }

  function renderForState(force = false) {
    if (!roomData) { renderError("Room not found."); return; }
    setMeta(`ROOM ${JOIN_CODE}`);
    // Skip if nothing the phone cares about changed (state, round, question, submission status)
    const renderKey = `${roomData.state}|${roomData.roundIdx}|${roomData.questionIdx}|${submittedKey}`;
    if (!force && renderKey === lastRenderKey) return;
    lastRenderKey = renderKey;
    switch (roomData.state) {
      case "lobby":         return renderWaiting();
      case "round_intro":   return renderRoundIntro();
      case "question":      return renderQuestion();
      case "round_end":     return renderRoundEnd();
      case "end":           return renderFinal();
      default: return renderWaiting();
    }
  }

  function renderWaiting() {
    getMain().innerHTML = `
      <div class="view">
        <div class="phone-screen pop">
          <span class="phone-team">${escapeHtml(teamName)}</span>
          <h2>YOU'RE IN!</h2>
          <p>Waiting for the host to start the game…</p>
        </div>
      </div>
    `;
  }

  function renderRoundIntro() {
    getMain().innerHTML = `
      <div class="view">
        <div class="phone-screen pop">
          <span class="phone-team">${escapeHtml(teamName)}</span>
          <h2>ROUND ${(roomData.roundIdx || 0) + 1}</h2>
          <div class="phone-cat">${escapeHtml(String(roomData.currentCategory || "").toUpperCase())}</div>
          <p style="margin-top:14px;">Get ready! First question is coming…</p>
        </div>
      </div>
    `;
  }

  function renderQuestion() {
    const qKey = `${roomData.roundIdx}_${roomData.questionIdx}`;
    const alreadySubmitted = (submittedKey === qKey);
    getMain().innerHTML = `
      <div class="view">
        <div class="phone-screen pop">
          <span class="phone-team">${escapeHtml(teamName)}</span>
          <div class="phone-cat">${escapeHtml(String(roomData.currentCategory || "").toUpperCase())}</div>
          <div class="phone-question">
            <span class="qnum">Q${(roomData.questionIdx || 0) + 1}</span>${escapeHtml(roomData.currentQuestion || "")}
          </div>
          ${
            alreadySubmitted
              ? `<div class="phone-submitted">✓ ANSWER SUBMITTED</div>
                 <p>Wait for the next question…</p>`
              : `<input class="phone-input" id="ansInput" type="text" autocomplete="off" autocapitalize="off" placeholder="Type your answer" />
                 <button class="phone-btn" id="subBtn">SUBMIT ANSWER</button>`
          }
        </div>
      </div>
    `;
    if (!alreadySubmitted) {
      const input = document.getElementById("ansInput");
      input.focus();
      const submit = async () => {
        const ans = input.value.trim();
        if (!ans) { input.focus(); return; }
        document.getElementById("subBtn").disabled = true;
        const id = `${roomData.roundIdx}_${roomData.questionIdx}_${user.uid}`;
        try {
          await setDoc(doc(db, "rooms", JOIN_CODE, "submissions", id), {
            teamId: user.uid,
            teamName,
            roundIdx: roomData.roundIdx,
            questionIdx: roomData.questionIdx,
            answer: ans,
            submittedAt: serverTimestamp(),
          });
          submittedKey = qKey;
          renderForState();
        } catch (e) {
          console.error(e);
          document.getElementById("subBtn").disabled = false;
          alert("Submission failed. Try again.");
        }
      };
      document.getElementById("subBtn").addEventListener("click", submit);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    }
  }

  function renderRoundEnd() {
    getMain().innerHTML = `
      <div class="view">
        <div class="phone-screen pop">
          <span class="phone-team">${escapeHtml(teamName)}</span>
          <h2>ROUND ${(roomData.roundIdx || 0) + 1} COMPLETE</h2>
          <p>Answers are revealed on the main screen.<br/>Tally your team's score!</p>
        </div>
      </div>
    `;
  }

  function renderFinal() {
    getMain().innerHTML = `
      <div class="view">
        <div class="phone-screen pop">
          <span class="phone-team">${escapeHtml(teamName)}</span>
          <h2>THANKS FOR PLAYING!</h2>
          <p>Hope you had fun.<br/>Highest score wins!</p>
        </div>
      </div>
    `;
  }

  // Boot phone
  try {
    user = await ensureAuth();
    const roomRef = doc(db, "rooms", JOIN_CODE);
    const initial = await getDoc(roomRef);
    if (!initial.exists()) { renderError(`Room ${JOIN_CODE} not found. Check the code.`); return; }
    // Subscribe to room state
    onSnapshot(roomRef, (snap) => {
      const prev = roomData;
      roomData = snap.data();
      if (!roomData) { renderError("Room closed."); return; }
      const newQKey = `${roomData.roundIdx}_${roomData.questionIdx}`;
      if (newQKey !== lastQKey) {
        lastQKey = newQKey;
        // clear submitted marker when question changes
        if (roomData.state === "question") submittedKey = "";
      }
      // Only switch to game state if the user has clicked JOIN for this room.
      if (!hasJoined) renderNameEntry();
      else renderForState();
    });

    // When the phone wakes up (user returns from another app/screen), pull the
    // latest room state explicitly — Firestore listeners can pause in the background.
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState !== "visible" || !hasJoined) return;
      try {
        const snap = await getDoc(roomRef);
        if (!snap.exists()) return;
        roomData = snap.data();
        const newQKey = `${roomData.roundIdx}_${roomData.questionIdx}`;
        if (newQKey !== lastQKey) {
          lastQKey = newQKey;
          if (roomData.state === "question") submittedKey = "";
        }
        renderForState(true);
      } catch (e) { console.warn("Visibility refresh failed:", e); }
    });

    // Always start on name entry; the input is pre-filled with the last used name.
    renderNameEntry();
  } catch (e) {
    console.error(e);
    renderError("Could not connect. Check your network and try again.");
  }
})();
</script>
</body>
</html>
