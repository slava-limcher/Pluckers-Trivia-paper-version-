<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pluckers Trivia</title>
<!-- Load the fonts so the host computer and the TVs render text identically
     (TVs usually don't have Impact, so we ship a web font instead). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c8102e;
    --red-dark: #9a0a22;
    --red-deep: #6b0717;
    --yellow: #f4c430;
    --yellow-bright: #ffd84d;
    --blue: #1d3a8a;
    --blue-dark: #142764;
    --blue-bright: #2a52be;
    --cream: #f7f1e3;
    --bg-mid: #0a1234;   /* page background mid/outer (derived from brand bg color) */
    --bg-bot: #060a1f;
    --black: #0c0c0c;
    --charcoal: #1a1a1a;
    --panel: #222;
    --ink: #fff8e7;
    --ink-dim: #d9c9a0;
    --good: var(--yellow);
    --shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(1400px 900px at 50% -15%, var(--blue-dark) 0%, var(--bg-mid) 60%, var(--bg-bot) 100%);
    color: var(--ink);
    font-family: "Anton", "Oswald", "Impact", "Bebas Neue", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(244,196,48,.035) 0 14px, transparent 14px 28px);
    pointer-events: none;
    z-index: 0;
  }
  /* ---- Background styles (set by the theme; default is the gradient above) ---- */
  body.bg-solid { background: var(--bg-bot); }
  body.bg-spotlight { background: radial-gradient(1100px 720px at 50% -8%, var(--blue-bright) 0%, var(--bg-mid) 42%, var(--bg-bot) 100%); }
  body.bg-stripes { background: radial-gradient(1400px 900px at 50% -15%, var(--blue-dark) 0%, var(--bg-mid) 60%, var(--bg-bot) 100%); }
  body.bg-image { background: linear-gradient(rgba(6,10,31,.55), rgba(6,10,31,.68)), var(--bg-image, none) center / cover no-repeat fixed; }
  body.bg-stripes::before { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 16px, transparent 16px 34px); }
  body.bg-solid::before, body.bg-spotlight::before, body.bg-image::before { opacity: 0; }
  /* The whole UI is laid out on a fixed 1920×1080 "stage" and scaled uniformly to
     fit any screen (1080p TV = 1×, 720p TV = 0.667×, laptops = proportional).
     This keeps every element in the exact same place at every resolution, so
     nothing overlaps no matter the screen size. */
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app {
    position: relative;
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    z-index: 1;
    transform: scale(var(--scale, 1));
    transform-origin: center center;
  }

  /* Header bar */
  header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;   /* slim bar that mirrors the footer */
    min-height: 0;
    background: var(--blue-dark);
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  header::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 9px;
    border-top: 2px solid var(--black);
    background: linear-gradient(180deg,
      var(--blue) 0,
      var(--blue) 33.33%,
      var(--yellow) 33.33%,
      var(--yellow) 66.66%,
      var(--red) 66.66%,
      var(--red) 100%);
  }
  header .meta { position: relative; z-index: 2; }
  .brand {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 16px;
    font-weight: 900;
    letter-spacing: 2px;
  }
  .brand .logo {
    width: 64px; height: 64px;
    border-radius: 12px;
    background: var(--cream);
    display: grid;
    place-items: center;
    font-size: 46px;
    font-weight: 900;
    color: var(--red);
    text-shadow: 2px 2px 0 var(--blue);
    box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 -3px 0 rgba(0,0,0,.12);
    border: 3px solid var(--black);
    transform: rotate(-4deg);
  }
  .brand .brand-logo-img {
    height: 72px;
    width: auto;
    max-width: 260px;
    object-fit: contain;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
  }
  .brand .name {
    font-size: 38px;
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--black);
    line-height: 1;
  }
  .brand .name small {
    display: block;
    font-size: 14px;
    color: var(--cream);
    letter-spacing: 6px;
    margin-top: 4px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.2);
  }
  /* "DON'T CHEAT!" badge — now on the left of the header (logo took the center). */
  .dont-cheat {
    position: relative;
    z-index: 2;
    transform: rotate(-2deg);
    background: var(--red);
    color: var(--yellow);
    border: 3px solid var(--black);
    border-radius: 12px;
    padding: 6px 22px;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--black);
    white-space: nowrap;
    z-index: 3;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  @media (max-width: 760px) {
    .dont-cheat { font-size: 15px; padding: 4px 12px; }
  }
  .meta {
    display: flex;
    gap: 14px;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--blue);
  }
  .meta .chip {
    background: var(--cream);
    border: 3px solid var(--blue);
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 900;
    color: var(--red);
  }
  .meta .chip b { color: var(--blue); }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    min-height: 0;
  }
  .view {
    width: 100%;
    max-width: 1500px;
    text-align: center;
  }
  /* Question/answer screens fill the whole board height so the content (badge,
     category, question box, "just walked in") spans ~85% of the screen instead
     of floating compactly in the middle. */
  .view.view-fill { height: 100%; max-width: 1600px; }
  .view-fill .q-screen { padding: 34px 0; }   /* a little breathing room top/bottom (~85% fill) */

  /* Title screen */
  .title-wrap { padding: 40px 0; }
  .title-logo {
    position: relative;
    width: 320px; height: 200px;
    margin: 0 auto 24px;
    border-radius: 18px;
    background:
      linear-gradient(135deg,
        var(--red) 0,
        var(--red) 11.5%, var(--black) 11.5%, var(--black) 12.5%,
        var(--blue) 12.5%, var(--blue) 26%, var(--black) 26%, var(--black) 27%,
        var(--yellow) 27%, var(--yellow) 73%, var(--black) 73%, var(--black) 74%,
        var(--blue) 74%, var(--blue) 87.5%, var(--black) 87.5%, var(--black) 88.5%,
        var(--red) 88.5%, var(--red) 100%
      );
    display: grid;
    place-items: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    border: 6px solid var(--black);
  }
  .title-logo .logo-p {
    font-size: 140px;
    font-weight: 900;
    color: var(--red);
    line-height: 1;
    text-shadow:
      4px 4px 0 var(--blue),
      8px 8px 0 var(--black);
  }
  .title-logo-img {
    display: block;
    width: auto;
    max-width: min(775px, 90vw);
    max-height: 350px;
    margin: 0 auto 24px;
    filter: drop-shadow(0 18px 32px rgba(0,0,0,.6));
  }
  h1.title {
    font-size: 130px;
    line-height: .95;
    margin: 0 0 8px;
    color: var(--red);
    text-shadow:
      5px 5px 0 var(--yellow),
      10px 10px 0 var(--blue),
      14px 14px 0 var(--black);
    letter-spacing: 4px;
  }
  h1.title .sub {
    display: block;
    font-size: 80px;
    color: var(--yellow);
    text-shadow:
      4px 4px 0 var(--blue),
      8px 8px 0 var(--black);
    letter-spacing: 14px;
    margin-top: 8px;
  }
  .lead {
    color: var(--ink);
    font-size: 30px;
    margin: 22px auto 32px;
    max-width: 960px;
    letter-spacing: 2px;
    line-height: 1.5;
  }
  .lead b { color: var(--yellow); }
  .win-prizes {
    position: fixed;
    left: 72px;
    top: 50%;
    transform: translateY(-50%) rotate(-8deg);
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, var(--yellow-bright), var(--yellow) 70%);
    border: 8px solid var(--red);
    box-shadow: 0 0 0 6px var(--blue), 0 18px 40px rgba(0,0,0,.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: .9;
    z-index: 5;
  }
  .win-prizes .wp-top {
    color: var(--blue);
    font-size: 50px;
    font-weight: 900;
    letter-spacing: 4px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }
  .win-prizes .wp-big {
    color: var(--red);
    font-size: 70px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 var(--black);
  }
  .instructions {
    position: fixed;
    right: 36px;
    top: 50%;
    transform: translateY(-50%) rotate(2deg);
    width: 460px;
    background: #ffffff;
    border: 6px solid var(--red);
    border-radius: 18px;
    box-shadow: 0 0 0 7px var(--blue), 0 20px 46px rgba(0,0,0,.55);
    padding: 0 0 26px;
    text-align: left;
    overflow: hidden;
    z-index: 5;
  }
  .instructions .instr-header {
    background: var(--red);
    color: var(--yellow);
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 16px 18px;
    text-align: center;
    text-shadow: 2px 2px 0 var(--black);
    border-bottom: 5px solid var(--black);
  }
  .instructions .instr-list {
    margin: 26px 0 0;
    padding: 0 28px 0 62px;
    color: var(--blue-dark);
  }
  .instructions .instr-list li {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 22px;
    letter-spacing: .3px;
  }
  .instructions .instr-list li:last-child { margin-bottom: 0; }
  .instructions .instr-list li b { color: var(--red); }

  /* Host's HOST GUIDE panel — more compact than the TVs' player instructions */
  #main .instructions {
    width: 440px;
    top: 128px; bottom: 64px; height: auto;   /* sits between the header & footer stripes */
    transform: none;                          /* no tilt → corners can't poke into the lines */
    display: flex; flex-direction: column; padding-bottom: 0;
  }
  #main .instructions .instr-header { font-size: 44px; padding: 22px 16px; flex: 0 0 auto; }
  #main .instructions .instr-list { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; margin: 0; padding: 16px 30px 16px 58px; }
  #main .instructions .instr-list li { font-size: 36px; margin: 0; line-height: 1.25; }

  @media (max-width: 1100px) {
    .win-prizes { width: 150px; height: 150px; left: 16px; border-width: 6px; }
    .win-prizes .wp-top { font-size: 28px; }
    .win-prizes .wp-big { font-size: 38px; }
    .instructions { width: 320px; right: 14px; }
    .instructions .instr-header { font-size: 30px; }
    .instructions .instr-list { padding: 0 18px 0 46px; }
    .instructions .instr-list li { font-size: 22px; margin-bottom: 16px; }
  }

  .grab-sheet {
    display: inline-block;
    margin: 24px auto 8px;
    padding: 18px 42px;
    background: var(--yellow);
    color: var(--red);
    border: 4px solid var(--black);
    border-radius: 14px;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--blue);
    box-shadow: 0 8px 0 var(--blue-dark), 0 14px 26px rgba(0,0,0,.5);
    transform: rotate(-2deg);
  }

  /* Buttons */
  .btn {
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    color: var(--cream);
    border: 4px solid var(--black);
    border-radius: 14px;
    padding: 22px 48px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 10px 0 var(--blue-dark), 0 18px 30px rgba(0,0,0,.5);
    transition: transform .08s ease, box-shadow .12s ease, filter .15s ease;
    font-family: inherit;
    text-transform: uppercase;
    text-shadow: 2px 2px 0 var(--black);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active {
    transform: translateY(6px);
    box-shadow: 0 4px 0 var(--blue-dark), 0 8px 16px rgba(0,0,0,.5);
  }
  .btn.ghost {
    background: transparent;
    color: var(--yellow);
    border-color: var(--yellow);
    box-shadow: none;
    text-shadow: none;
  }
  .btn-row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }

  .hint {
    margin-top: 28px;
    color: var(--cream);
    font-size: 16px;
    letter-spacing: 2px;
  }
  .hint kbd {
    display: inline-block;
    background: var(--yellow);
    color: var(--red);
    border: 2px solid var(--black);
    border-bottom-width: 4px;
    border-radius: 6px;
    padding: 4px 10px;
    margin: 0 4px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
  }

  /* Round intro */
  @keyframes round-label-in {
    0%   { opacity: 0; transform: translateY(-24px); letter-spacing: 4px; }
    100% { opacity: 1; transform: translateY(0); letter-spacing: 18px; }
  }
  @keyframes round-number-pop {
    0%   { opacity: 0; transform: scale(.4) rotate(-8deg); }
    60%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes round-rise {
    0%   { opacity: 0; transform: translateY(28px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .round-intro {
    padding: 40px;
  }
  .round-label {
    font-size: 48px;
    letter-spacing: 18px;
    color: var(--cream);
    text-shadow: 3px 3px 0 var(--blue);
    margin-bottom: 8px;
    animation: round-label-in .35s ease-out both;
  }
  .round-number {
    font-size: 220px;
    line-height: 1;
    color: var(--yellow);
    text-shadow:
      6px 6px 0 var(--red),
      12px 12px 0 var(--blue),
      18px 18px 0 var(--black);
    margin: 0;
    animation: round-number-pop .5s cubic-bezier(.2,.8,.3,1.2) .12s both;
  }
  .round-category {
    font-size: 84px;
    color: var(--red);
    text-shadow:
      4px 4px 0 var(--yellow),
      8px 8px 0 var(--black);
    margin: 16px 0 8px;
    letter-spacing: 6px;
    animation: round-rise .4s ease-out .42s both;
  }
  .round-count {
    font-size: 26px;
    color: var(--cream);
    letter-spacing: 4px;
    margin-bottom: 32px;
    animation: round-rise .4s ease-out .55s both;
  }

  /* Question screen */
  .q-screen {
    display: flex;
    flex-direction: column;
    gap: 18px;
    height: 100%;
    position: relative;   /* anchor for the host scoreboard panel */
  }
  /* Host-only scoreboard panel — top-center of the question screen (between the
     QUESTION badge and the category). Hidden on the TVs. */
  .q-topbar-left { display: flex; align-items: center; gap: 16px; }
  .q-score {
    background: var(--yellow); color: var(--red);
    border: 4px solid var(--black); border-radius: 12px;
    font-size: 30px; font-weight: 900; letter-spacing: 2px;
    padding: 12px 64px; white-space: nowrap; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.45);
  }
  body.display-mode .q-score { display: none; }
  .q-main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }
  /* TVs match the host: the timer lives inside the top bar (between the QUESTION
     badge and the category), so the question flows below naturally — no extra
     padding, no dropping the question down. */
  .q-topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    animation: q-badge-drop .3s ease-out both;
  }
  /* Timer + SCOREBOARD pill stacked in the top-center, above the question. */
  .q-topcenter { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .q-badge {
    background: var(--blue);
    border: 5px solid var(--black);
    border-radius: 14px;
    padding: 14px 34px;
    font-size: 44px;
    letter-spacing: 4px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--black);
  }
  .q-category {
    background: var(--red);
    border: 5px solid var(--black);
    border-radius: 14px;
    padding: 14px 34px;
    font-size: 48px;
    letter-spacing: 4px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--black);
  }
  @keyframes q-enter {
    0%   { opacity: 0; transform: translateX(48px) scale(.97); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes q-badge-drop {
    0%   { opacity: 0; transform: translateY(-16px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .q-text {
    flex: 1;                       /* grow to fill the middle of the board */
    display: flex;
    align-items: center;
    justify-content: center;       /* center the question text inside the big box */
    animation: q-enter .3s cubic-bezier(.2,.7,.3,1) both;
    font-size: 104px;
    line-height: 1.16;
    color: var(--cream);
    background: linear-gradient(180deg, var(--blue-dark), #0a1234);
    border: 5px solid var(--yellow);
    border-radius: 22px;
    padding: 40px 50px;
    box-shadow: var(--shadow);
    letter-spacing: 1px;
  }
  .q-text-body { width: 100%; }
  .q-text .q-num {
    display: inline-block;
    background: var(--yellow);
    color: var(--red);
    border: 3px solid var(--black);
    border-radius: 12px;
    padding: 4px 18px;
    margin-right: 18px;
    font-size: 0.8em;          /* scales with the auto-fitted question text */
    vertical-align: middle;
    text-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .choice {
    display: flex;
    align-items: center;
    gap: 22px;
    background: var(--cream);
    border: 4px solid var(--black);
    border-radius: 16px;
    padding: 22px 28px;
    font-size: 34px;
    text-align: left;
    color: var(--blue-dark);
    transition: transform .15s, border-color .15s, background .25s;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  .choice .letter {
    flex: 0 0 70px;
    height: 70px;
    border-radius: 14px;
    background: var(--red);
    color: var(--cream);
    display: grid;
    place-items: center;
    font-size: 42px;
    font-weight: 900;
    text-shadow: 2px 2px 0 var(--black);
    border: 3px solid var(--black);
  }
  .choice:nth-child(2) .letter,
  .choice:nth-child(3) .letter {
    background: var(--blue);
  }
  .choice.reveal-correct {
    background: linear-gradient(180deg, var(--yellow-bright), var(--yellow));
    border-color: var(--red);
    transform: scale(1.03);
    box-shadow: 0 10px 30px rgba(244,196,48,.5), 0 0 0 4px var(--blue) inset;
  }
  .choice.reveal-correct .letter {
    background: var(--red);
    color: var(--cream);
    border-color: var(--black);
  }
  .choice.reveal-correct .choice-text {
    color: var(--red);
    font-weight: 900;
    text-shadow: 1px 1px 0 rgba(0,0,0,.1);
  }
  .choice.reveal-dim {
    opacity: .35;
  }

  /* Answer reveal banner */
  .reveal-banner {
    margin-top: 12px;
    font-size: 36px;
    color: var(--yellow);
    letter-spacing: 4px;
    text-shadow:
      3px 3px 0 var(--red),
      6px 6px 0 var(--black);
    animation: pop .35s ease;
  }
  @keyframes pop {
    0% { transform: scale(.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Round end */
  .round-end h2 {
    font-size: 100px;
    color: var(--red);
    text-shadow:
      6px 6px 0 var(--yellow),
      12px 12px 0 var(--blue),
      18px 18px 0 var(--black);
    margin: 0 0 20px;
    letter-spacing: 4px;
  }
  .round-end .answers-list {
    background: var(--cream);
    border: 5px solid var(--blue);
    border-radius: 18px;
    padding: 30px;
    margin: 24px auto;
    max-width: 1100px;
    box-shadow: var(--shadow);
    text-align: left;
  }
  .answers-list ol {
    columns: 2;
    column-gap: 60px;
    margin: 0;
    padding-left: 24px;
    font-size: 26px;
    line-height: 1.7;
    color: var(--blue-dark);
  }
  .answers-list ol b { color: var(--red); }

  /* End screen */
  .end h2 {
    font-size: 110px;
    color: var(--red);
    text-shadow:
      6px 6px 0 var(--yellow),
      12px 12px 0 var(--blue),
      18px 18px 0 var(--black);

    letter-spacing: 6px;

    font-size: 30px;
    color: var(--cream);
    letter-spacing: 3px;

  /* Footer */
  footer {
    position: relative;
    padding: 14px 32px;
    background: var(--blue-dark);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--cream);

    position: absolute;
    top: 0; left: 0; right: 0;
    height: 9px;
    border-bottom: 2px solid var(--black);
    background: linear-gradient(180deg,
      var(--red) 0,
      var(--red) 33.33%,
      var(--yellow) 33.33%,
      var(--yellow) 66.66%,
      var(--blue) 66.66%,
      var(--blue) 100%);

  footer kbd {
    background: var(--cream);
    color: var(--red);
    border: 1px solid var(--black);

    border-radius: 4px;
    padding: 2px 8px;
    margin: 0 2px;

  .round-end-answers {

    font-size: 56px;

    background: var(--cream);
    border: 5px solid var(--blue);

    box-shadow: var(--shadow);
    text-align: left;
    color: var(--blue-dark);
  }
  .qa-list ol {
    list-style: none;
    margin: 0;
    padding: 0;
    columns: 2;
    column-gap: 40px;
    column-rule: 2px dashed rgba(29,58,138,.25);
  }
  /* Font sizes are driven by a base font-size set on .qa-list by JS (auto-fit).
     Everything below is in em so the whole list scales together. */
  .qa-list { font-size: 40px; }
  .qa-item {
    break-inside: avoid;
    page-break-inside: avoid;
    padding: .3em 0;
    border-bottom: 1px dashed rgba(29,58,138,.15);

  .qa-item:last-child { border-bottom: 0; }
  .qa-q {
    font-weight: 900;
    color: var(--blue-dark);
    line-height: 1.15;
    font-size: 1em;
  }
  .qa-num {
    display: inline-block;
    color: var(--red);
    margin-right: .2em;
    font-weight: 900;
  }
  .qa-a {
    color: var(--red);
    margin-top: .05em;
    line-height: 1.12;
    padding-left: .1em;
    font-size: .86em;
  }
  .qa-a b {
    color: var(--blue);
    letter-spacing: 1px;
    margin-right: 4px;
    font-size: .85em;
  }

  .round-end-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    padding-top: 4px;
  }
  .round-end-footer .lead-inline {
    color: var(--cream);
    font-size: 22px;
    letter-spacing: 3px;
  }

  /* Status pill on title screen */
  .status-pill {
    display: inline-block;

    font-size: 30px;
    letter-spacing: 2px;
    margin: 0 0 24px;
    font-weight: 900;

  .status-pill.custom { border-color: var(--red); }
  .status-pill.custom b { color: var(--blue); }

  /* Modal */
  /* Go-live dialog helpers */
  .gl-warn { background:#fdecea; border:2px solid var(--red); color:#9b1c1c; font-weight:800;
             border-radius:10px; padding:10px 14px; margin:6px 0 2px; }
  .gl-ok   { background:#e7f6ec; border:2px solid #2e7d32; color:#1b5e20; font-weight:800;
             border-radius:10px; padding:10px 14px; margin:6px 0 2px; }
  .gl-foot { font-size:13px; opacity:.75; margin:14px 0 0; }
  #glUrl { font-weight:800; letter-spacing:.3px; }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 31, .85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
    overflow-y: auto;
  }
  .modal {
    background: var(--cream);
    color: var(--blue-dark);
    border: 6px solid var(--blue);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    width: 100%;
    max-width: 720px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 28px 32px;
    position: relative;
  }
  .modal::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 14px;
    background: linear-gradient(180deg,
      var(--red) 0,
      var(--red) 50%,
      var(--yellow) 50%,
      var(--yellow) 100%);
    border-radius: 14px 14px 0 0;
  }
  .modal h2 {
    margin: 18px 0 6px;
    color: var(--red);
    font-size: 38px;
    letter-spacing: 3px;
    text-shadow: 2px 2px 0 var(--yellow);
  }
  .modal .modal-lead {
    color: var(--blue-dark);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 20px;
    letter-spacing: 1px;
  }
  .modal .field {
    margin-bottom: 20px;
  }
  .modal label {
    display: block;
    font-size: 16px;
    color: var(--red);
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-weight: 900;
  }
  .modal input[type="file"] {
    display: block;
    width: 100%;
    padding: 10px;
    background: #fff;
    border: 2px dashed var(--blue);
    border-radius: 8px;
    font-family: inherit;
    color: var(--blue-dark);
  }
  .modal textarea {
    width: 100%;
    min-height: 180px;
    padding: 14px;
    background: #fff;
    border: 2px solid var(--blue);
    border-radius: 8px;
    font-family: ui-monospace, "Consolas", "Courier New", monospace;
    font-size: 14px;
    color: var(--blue-dark);
    resize: vertical;
    line-height: 1.5;
  }
  .modal input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    background: #fff;
    border: 2px solid var(--blue);
    border-radius: 10px;
    font-family: inherit;
    font-size: 22px;
    font-weight: 800;
    color: var(--blue-dark);
    box-sizing: border-box;
  }
  .modal textarea:focus, .modal input[type="file"]:focus, .modal input[type="text"]:focus {
    outline: none;
    border-color: var(--red);
  }
  .format-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 12px;
    border-bottom: 3px solid var(--blue);
  }
  .format-tab {
    background: transparent;
    border: 0;
    border-bottom: 4px solid transparent;
    margin-bottom: -3px;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: 900;
    color: var(--blue);
    cursor: pointer;
  }
  .format-tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
  }
  .format-help {
    background: rgba(29, 58, 138, .08);
    border-left: 4px solid var(--blue);
    padding: 10px 14px;
    margin: 0 0 10px;
    font-size: 13px;
    font-family: ui-monospace, "Consolas", "Courier New", monospace;
    color: var(--blue-dark);
    white-space: pre;
    overflow-x: auto;
    border-radius: 0 6px 6px 0;
  }
  .modal-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 2px solid rgba(29, 58, 138, .2);
  }
  /* ---- BUILD-YOUR-OWN sheet ---- */
  .bld-controls {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px;
    background: rgba(29, 58, 138, .07); border: 2px solid rgba(29,58,138,.25);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 18px;
  }
  .bld-num { display: flex; flex-direction: column; }
  .bld-num label { margin-bottom: 6px; font-size: 13px; }
  .bld-num input[type="number"] {
    width: 120px; padding: 10px 12px; font-size: 22px; font-weight: 900;
    border: 2px solid var(--blue); border-radius: 8px; background: #fff;
    color: var(--blue-dark); box-sizing: border-box; text-align: center;
  }
  .bld-num input[type="number"]:focus { outline: none; border-color: var(--red); }
  .bld-total { margin-left: auto; align-self: center; font-weight: 900; color: var(--red);
    letter-spacing: 1px; font-size: 15px; }
  #builderGrid { display: flex; flex-direction: column; gap: 16px; }
  .bld-cat { border: 2px solid var(--blue); border-radius: 12px; padding: 14px; background: #fff; }
  .bld-cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bld-cat-no { background: var(--red); color: var(--cream); font-weight: 900; border-radius: 8px;
    padding: 8px 12px; white-space: nowrap; letter-spacing: 1px; font-size: 13px; }
  .bld-qrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bld-qn { width: 28px; text-align: right; font-weight: 900; color: var(--blue); flex: 0 0 auto; }
  .modal input[type="text"].bld-catname { flex: 1; padding: 10px 12px; font-size: 18px; }
  .modal input[type="text"].bld-q { flex: 2; padding: 9px 11px; font-size: 15px; font-weight: 600; }
  .modal input[type="text"].bld-a { flex: 1; padding: 9px 11px; font-size: 15px; font-weight: 600; }
  /* ---- Branding modal ---- */
  .brand-colors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .brand-color { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #fff; border: 2px solid var(--blue); border-radius: 10px; padding: 8px 14px;
    font-size: 15px; font-weight: 800; color: var(--blue-dark); }
  .brand-color input[type="color"] { width: 56px; height: 40px; border: 2px solid var(--blue);
    border-radius: 8px; background: #fff; cursor: pointer; padding: 2px; flex: 0 0 auto; }
  .brand-logo-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand-logo-preview { width: 210px; min-height: 96px; display: flex; align-items: center;
    justify-content: center; background: var(--blue-dark); border: 2px solid var(--blue);
    border-radius: 10px; padding: 10px; color: var(--cream); flex: 0 0 auto; }
  .brand-logo-btns { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 220px; }
  .brand-logo-btns .btn { padding: 10px 14px; font-size: 15px; }
  .modal .btn {
    padding: 14px 28px;
    font-size: 18px;
    box-shadow: 0 6px 0 var(--blue-dark);
  }
  .modal .btn:active {
    box-shadow: 0 2px 0 var(--blue-dark);
  }
  .modal .btn.secondary {
    background: var(--cream);
    color: var(--blue);
    border-color: var(--blue);
    text-shadow: none;
    box-shadow: 0 6px 0 var(--blue-dark);
  }
  .modal .btn.danger {
    background: var(--yellow);
    color: var(--red);
    text-shadow: none;
  }
  .modal .error-msg {
    background: var(--red);
    color: var(--cream);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    border: 2px solid var(--black);
  }
  .modal .ok-msg {
    background: var(--blue);
    color: var(--yellow);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    border: 2px solid var(--black);
  }
  .modal .close-x {
    position: absolute;
    top: 22px;
    right: 18px;
    background: transparent;
    border: 0;
    color: var(--blue);
    font-size: 28px;
    font-weight: 900;
    cursor: pointer;
    line-height: 1;
    padding: 4px 10px;
    z-index: 2;
  }
  .modal .close-x:hover { color: var(--red); }

  @media (max-width: 900px) {
    h1.title { font-size: 80px; }
    h1.title .sub { font-size: 50px; letter-spacing: 8px; }
    .q-text { font-size: 36px; padding: 28px; }
    .choice { font-size: 24px; padding: 18px; }
    .choice .letter { flex-basis: 54px; height: 54px; font-size: 32px; }
    .choices { grid-template-columns: 1fr; }
    .round-number { font-size: 140px; }
    .round-category { font-size: 56px; letter-spacing: 4px; }
    .answers-list ol { columns: 1; font-size: 22px; }
  }
  /* ---- Live multi-screen sync ---- */
  #liveBanner {
    position: fixed;
    bottom: 76px;            /* sits ABOVE the footer keyboard-hint bar so they never overlap */
    left: 18px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--blue-dark);
    border: 3px solid var(--yellow);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
    color: var(--cream);
    max-width: 420px;
  }
  #liveBanner .lb-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #2ed573; flex: 0 0 auto;
    box-shadow: 0 0 0 0 rgba(46,213,115,.7);
    animation: lb-pulse 1.6s infinite;
  }
  @keyframes lb-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(46,213,115,.6); }
    70%  { box-shadow: 0 0 0 12px rgba(46,213,115,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,213,115,0); }
  }
  #liveBanner .lb-info { text-align: left; min-width: 0; }
  #liveBanner .lb-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
  #liveBanner .lb-title b { color: var(--yellow); font-size: 22px; letter-spacing: 3px; }
  #liveBanner .lb-url { font-size: 11px; color: #9fb6c8; word-break: break-all; margin-top: 2px; }
  #liveBanner .lb-code { font-size: 44px; font-weight: 900; color: var(--yellow); letter-spacing: 8px; line-height: 1; margin: 4px 0 2px; }
  #liveBanner .lb-howto { font-size: 11px; color: #cfe8ff; margin-top: 4px; line-height: 1.4; max-width: 240px; }
  #liveBanner .lb-howto b { color: #fff; }
  #liveBanner .lb-warn { font-size: 11px; color: var(--yellow); margin-top: 6px; line-height: 1.35; max-width: 240px; }
  #liveBanner .lb-warn b { color: #fff; }

  /* TV "enter room code" setup screen */
  .code-entry { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 40px; }
  .code-entry .ce-title { font-size: 64px; color: var(--yellow); margin: 0; letter-spacing: 6px; text-shadow: 3px 3px 0 var(--blue); }
  .code-entry .ce-sub { font-size: 26px; color: var(--cream); margin: 0; }
  .code-entry .ce-input {
    font-size: 90px; font-weight: 900; letter-spacing: 20px; text-align: center;
    width: 460px; max-width: 90vw; padding: 18px 10px 18px 30px;
    border-radius: 16px; border: 5px solid var(--yellow); background: var(--cream);
    color: var(--blue-dark); text-transform: uppercase;
  }
  .code-entry .ce-input:focus { outline: none; border-color: var(--red); }
  .code-entry .ce-err { color: var(--yellow); font-size: 20px; min-height: 22px; margin: 0; }

  /* "How to play" line under the question — TV displays only (for mid-game joiners). */
  .q-howto { display: none; }
  body.display-mode .q-howto {
    display: block;
    align-self: center;
    max-width: 1400px;
    margin-top: 6px;
    font-family: "Fredoka", "Poppins", "Segoe UI", system-ui, sans-serif;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: .5px;
    line-height: 1.3;
    text-align: center;
    color: var(--cream);
    background: rgba(20,39,100,.55);
    border: 2px solid var(--black);
    border-radius: 16px;
    padding: 18px 32px;
  }

  /* "TURN IN YOUR ANSWER SHEET!" — shown after the last question of each round */
  .turn-in { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; height: 100%; }
  .turn-in .turn-in-big {
    font-size: 130px;
    line-height: 1.02;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--red);
    text-shadow: 4px 4px 0 var(--yellow), 8px 8px 0 var(--black);
    animation: turnin-pop .45s cubic-bezier(.2,.8,.3,1.2) both;
  }
  .turn-in .turn-in-sub { font-size: 34px; color: var(--cream); letter-spacing: 2px; }
  @keyframes turnin-pop {
    0%   { opacity: 0; transform: scale(.7); }
    60%  { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  #liveBanner .lb-qr { background: #fff; padding: 5px; border-radius: 8px; flex: 0 0 auto; }
  #liveBanner .lb-qr img, #liveBanner .lb-qr canvas { display: block; }
  #liveBanner .lb-stop {
    flex: 0 0 auto; padding: 8px 12px; border: none; border-radius: 8px;
    background: var(--red); color: #fff; font-weight: 800; cursor: pointer; font-size: 12px;
  }
  #liveBanner .lb-link {
    flex: 0 0 auto; padding: 8px 12px; border: none; border-radius: 8px;
    background: var(--yellow); color: var(--blue-dark); font-weight: 800; cursor: pointer; font-size: 12px;
  }
  #displayTag {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 50;
    background: rgba(20,39,100,.85);
    border: 2px solid var(--yellow);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px; font-weight: 800; letter-spacing: 2px;
    color: var(--yellow);
  }
  /* ---- TV / display mode: clean board, no controls ---- */
  /* Hide every interactive / host-only element inside the mirrored views. */
  body.display-mode #main .btn-row,
  body.display-mode #main .hint,
  body.display-mode #main .setup-row,
  body.display-mode #main .loc-bar,
  body.display-mode #main .win-prizes,
  body.display-mode #main .instructions,
  body.display-mode #main .round-end-footer .btn,
  body.display-mode #meta,
  body.display-mode footer .controls { display: none; }

  /* Header (host AND TV) = a clean colored-stripe bar that mirrors the footer:
     no logo, no DON'T CHEAT, no round/question meta, no room tag — just the line. */
  .brand,
  .dont-cheat,
  #meta,
  #displayTag { display: none; }

  /* Location-name bar (host title screen only) */
  .loc-bar {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
    background: rgba(0,0,0,.28); border: 2px solid var(--yellow);

  .loc-input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 4px rgba(214,40,40,.25); }
  .loc-hint { color: var(--cream); font-size: 13px; opacity: .8; width: 100%; text-align: center; }

  /* Persistent instructions panel injected on TVs (lives outside #main so it
     survives re-renders). Reuses the .instructions look. */
  #tvInstructions { /* positioning inherited from .instructions */ }
  /* Title setup row (timer) */
  .setup-row { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .setup-label { color: var(--cream); font-weight: 800; font-size: 18px; letter-spacing: 1px; }
  .timer-input {
    width: 92px; font-size: 22px; padding: 8px 10px; border-radius: 10px;
    border: 2px solid var(--yellow); background: var(--cream); color: var(--blue-dark);
    text-align: center; font-weight: 800;
  }
  .timer-input:focus { outline: none; border-color: var(--red); }

  /* Question countdown timer — on the host it sits in the top bar (above the
     SCOREBOARD pill); on the TVs it drops below the Top-3 banner (absolute). */
  .q-timer {
    background: var(--yellow); color: var(--blue-dark);
    border: 5px solid var(--black); border-radius: 16px;
    padding: 8px 36px; font-size: 64px; font-weight: 900; line-height: 1;
    min-width: 150px; text-align: center;
  }
  .q-timer.q-timer-up { background: var(--red); color: #fff; }
  /* On the TV the timer stays in-flow in the top bar (same as the host), centered
     between the QUESTION badge and the category. */
  /* Host title-screen scoreboard box (replaces WIN PRIZES on the host; TVs keep WIN PRIZES) */
  .title-scoreboard {
    position: fixed;
    left: 36px;
    top: 50%;
    transform: translateY(-50%) rotate(-2deg);
    width: 380px;
    max-height: 72vh;
    overflow: hidden;
    background: #ffffff;
    color: var(--blue-dark);
    border: 6px solid var(--red);
    border-radius: 18px;
    box-shadow: 0 0 0 7px var(--blue), 0 20px 46px rgba(0,0,0,.55);
    padding: 0 0 14px;
    text-align: left;
    cursor: pointer;
    z-index: 5;

  body.display-mode .title-scoreboard { display: none; }  /* host only */
  .title-scoreboard .ts-head {

  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }

  @keyframes confetti-fall {

    0%   { opacity: 0; transform: scale(.4) rotate(-6deg); }

const STORAGE_KEY = "pluckers-trivia-rounds";

// ---- Question timer ----
const TIMER_KEY = "pluckers-trivia-timer";
let TIMER_SECS = (function () { const n = parseInt(localStorage.getItem(TIMER_KEY), 10); return isNaN(n) ? 0 : n; })(); // 0 = off
let TIMER_END = 0;                 // epoch ms the current question's timer ends (0 = none)
function saveTimer() { try { localStorage.setItem(TIMER_KEY, String(TIMER_SECS)); } catch (e) {} }

// ============================================================
// BRANDING / THEME — title text, colors, and logo are customizable per brand.
// A few key colors are picked; the rest of the palette is derived from them.
// ============================================================
const THEME_KEY = "trivia-brand-theme";
const DEFAULT_THEME = {
  title1: "TRIVIA",
  title2: "NIGHT",
  logo: "",            // "" = built-in logo · "none" = no logo (text only) · else a data URL
  primary: "#c8102e",  // brand main  (drives the red family)
  accent:  "#f4c430",  // highlight   (drives the yellow family)
  deep:    "#1d3a8a",  // background  (drives the blue family + page background)
  light:   "#f7f1e3",  // light text  (drives the cream/ink family)
  bg:      "gradient", // background style: gradient | solid | spotlight | stripes | image
  bgimg:   ""          // background image URL (used when bg = image)
};
function loadTheme() {
  try { const raw = localStorage.getItem(THEME_KEY); if (raw) return Object.assign({}, DEFAULT_THEME, JSON.parse(raw)); } catch (e) {}
  return Object.assign({}, DEFAULT_THEME);
}
function saveTheme() { try { localStorage.setItem(THEME_KEY, JSON.stringify(THEME)); } catch (e) {} }
let THEME = loadTheme();

// --- color helpers: derive darker/lighter shades from the chosen colors ---
function _hexToRgb(c) { c = String(c || "").replace("#", ""); if (c.length === 3) c = c.split("").map(x => x + x).join(""); const n = parseInt(c, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function _rgbToHex(a) { return "#" + a.map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0")).join(""); }
function _darken(hex, amt) { return _rgbToHex(_hexToRgb(hex).map(x => x * (1 - amt))); }
function _lighten(hex, amt) { return _rgbToHex(_hexToRgb(hex).map(x => x + (255 - x) * amt)); }

// Push the theme into the CSS custom properties the whole UI is built on.
function applyTheme(t) {
  const s = document.documentElement.style;
  s.setProperty("--red", t.primary);
  s.setProperty("--red-dark", _darken(t.primary, .18));
  s.setProperty("--red-deep", _darken(t.primary, .42));
  s.setProperty("--yellow", t.accent);
  s.setProperty("--yellow-bright", _lighten(t.accent, .14));
  s.setProperty("--blue", t.deep);
  s.setProperty("--blue-dark", _darken(t.deep, .34));
  s.setProperty("--blue-bright", _lighten(t.deep, .18));
  s.setProperty("--cream", t.light);
  s.setProperty("--ink", t.light);
  s.setProperty("--ink-dim", _darken(t.light, .18));
  s.setProperty("--bg-mid", _darken(t.deep, .58));
  s.setProperty("--bg-bot", _darken(t.deep, .74));
  // Background style (gradient | solid | spotlight | stripes | image)
  const b = document.body;
  if (b) {
    b.classList.remove("bg-gradient", "bg-solid", "bg-spotlight", "bg-stripes", "bg-image");
    if ((t.bg === "image" || t.bgimg) && t.bgimg) {
      b.style.setProperty("--bg-image", 'url("' + t.bgimg + '")');
      b.classList.add("bg-image");
    } else {
      b.style.removeProperty("--bg-image");
      b.classList.add("bg-" + (t.bg && t.bg !== "image" ? t.bg : "gradient"));
    }
  }
}
applyTheme(THEME);

// A "version" link can carry its whole brand in the URL (made by make.html):
//   ?title1=BAR&title2=QUIZ&primary=6b21a8&accent=ff8a00&deep=241036&light=fff7ed&logo=https://…
// When present, those override the saved theme so the link reproduces the brand
// on any device. (No params = the default theme — nothing changes.)
(function applyUrlTheme() {
  try {
    const p = new URLSearchParams(location.search);
    const COLORS = ["primary", "accent", "deep", "light"];
    let touched = false;
    // p.get() already URL-decodes, so no extra decodeURIComponent (keeps data-URL logos intact).
    ["title1", "title2", "logo", "bg", "bgimg", ...COLORS].forEach(k => {
      let v = p.get(k);
      if (v == null || v === "") return;
      if (COLORS.includes(k) && v[0] !== "#") v = "#" + v;
      THEME[k] = v;
      touched = true;
    });
    if (touched) applyTheme(THEME);
  } catch (e) {}

// ============================================================
// STATE
// ============================================================
const State = {
  TITLE: "title",
  ROUND_INTRO: "round_intro",
  QUESTION: "question",
  TURN_IN: "turn_in",     // "TURN IN YOUR ANSWER SHEET!" after a round's last question
  ANSWER: "answer",       // one question + its answer, revealed one screen at a time
  FINAL_BOARD: "final_board", // full-screen Top 3 at the very end
  WINNER: "winner",       // winning team + "collect your prize"
  ROUND_END: "round_end", // (legacy full answer list — no longer scheduled)
  END: "end"
};

const game = {
  state: State.TITLE,
  roundIdx: 0,
  questionIdx: 0,
  answersIdx: 0,
  isFinal: false,  // board/winner: true = all-time (end), false = after a round
  cursor: 0        // position in SCHEDULE (the full ordered list of screens)
};

// The whole game is a flat, ordered list of screens, computed from ROUNDS.
// Each round: intro → its questions → TURN IN → that round's answers shown
// ONE AT A TIME (before the next round). Last round's answers come before the end.
let SCHEDULE = [];
function buildSchedule() {
  const s = [{ state: State.TITLE }];
  const N = ROUNDS.length;
  for (let r = 0; r < N; r++) {
    const len = ROUNDS[r].questions.length;
    s.push({ state: State.ROUND_INTRO, roundIdx: r });
    for (let qi = 0; qi < len; qi++) {
      s.push({ state: State.QUESTION, roundIdx: r, questionIdx: qi });
    }
    s.push({ state: State.TURN_IN, roundIdx: r });
    for (let qi = 0; qi < len; qi++) {   // reveal each answer of this round, one screen each
      s.push({ state: State.ANSWER, roundIdx: r, questionIdx: qi });
    }
    if (r < N - 1) {
      // After each round (except the last): standings + the leader so far.
      s.push({ state: State.FINAL_BOARD, roundIdx: r, final: false });
      s.push({ state: State.WINNER, roundIdx: r, final: false });
    } else {
      // After the final round: all-time Top 3 + the overall champion.
      s.push({ state: State.FINAL_BOARD, final: true });
      s.push({ state: State.WINNER, final: true });
    }
  }
  s.push({ state: State.END });
  SCHEDULE = s;
}
function applyFrame(f) {
  if (!f) return;
  game.state       = f.state;
  game.roundIdx    = f.roundIdx    || 0;
  game.questionIdx = f.questionIdx || 0;
  game.answersIdx  = (f.answersIdx != null) ? f.answersIdx : 0;
  game.isFinal     = !!f.final;
}
function gotoCursor(n) {
  game.cursor = Math.max(0, Math.min(n, SCHEDULE.length - 1));
  applyFrame(SCHEDULE[game.cursor]);
  // Host starts a fresh countdown each time it lands on a question.
  if (game.state === State.QUESTION && TIMER_SECS > 0) {
    TIMER_END = Date.now() + TIMER_SECS * 1000;
  } else {
    TIMER_END = 0;
  }
  render();
}

const main = document.getElementById("main");
const meta = document.getElementById("meta");

function totalQuestions() {
  return ROUNDS.reduce((sum, r) => sum + r.questions.length, 0);
}
function questionGlobalIndex() {
  let n = 0;
  for (let i = 0; i < game.roundIdx; i++) n += ROUNDS[i].questions.length;
  return n + game.questionIdx + 1;
}

function renderMeta() {
  if (game.state === State.TITLE || game.state === State.END ||
      game.state === State.FINAL_BOARD || game.state === State.WINNER) {
    meta.innerHTML = "";
    return;
  }
  const round = ROUNDS[game.roundIdx];
  const qChip = (game.state === State.QUESTION)
    ? `<div class="chip">QUESTION <b>${game.questionIdx + 1}</b> / ${round.questions.length}</div>`
    : "";
  meta.innerHTML = `
    <div class="chip">ROUND <b>${game.roundIdx + 1}</b> / ${ROUNDS.length}</div>

  `;
}

  const colors = ["#fd1d1e", "#f4c430", "#1d3a8a", "#ffd84d", "#f7f1e3", "#2a52be"];
  let html = "";
  for (let i = 0; i < 70; i++) {
    const left = Math.floor(Math.random() * 100);
    const delay = (Math.random() * 3.5).toFixed(2);
    const dur = (2.6 + Math.random() * 2.6).toFixed(2);
    const drift = Math.floor(Math.random() * 60 - 30);
    const wpx = 8 + Math.floor(Math.random() * 9);
    const color = colors[Math.floor(Math.random() * colors.length)];
    html += '<i class="confetti-piece" style="left:' + left + '%;background:' + color +
            ';width:' + wpx + 'px;height:' + Math.round(wpx * 1.6) + 'px;animation-delay:' + delay +
            's;animation-duration:' + dur + 's;--drift:' + drift + 'px;"></i>';
  }
  box.innerHTML = html;
}

// Scale the answer list so every question+answer fits on one screen with
// no scrolling and as little empty space as possible.
function fitAnswers() {
  const box = main.querySelector(".qa-list");
  if (!box) return;
  const ol = box.querySelector("ol");
  if (!ol) return;

  const fits = () =>
    ol.scrollHeight <= box.clientHeight && ol.scrollWidth <= box.clientWidth;

  const MIN = 14, MAX = 64;
  // Binary search for the largest base font-size that still fits.
  let lo = MIN, hi = MAX, best = MIN;
  for (let i = 0; i < 18; i++) {
    const mid = (lo + hi) / 2;
    box.style.fontSize = mid + "px";
    if (fits()) { best = mid; lo = mid; }
    else { hi = mid; }
  }
  box.style.fontSize = best + "px";
}

// Scale the question text so it fills the big question box (large font for short
// questions, smaller for long ones) — keeps the box from looking empty.
function fitQuestion() {
  const box = main.querySelector(".q-text");
  if (!box) return;
  const body = box.querySelector(".q-text-body");
  if (!body) return;
  const cs = getComputedStyle(box);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const fits = () =>
    body.scrollWidth <= (box.clientWidth - padX) + 1 &&
    body.scrollHeight <= (box.clientHeight - padY) + 1;

  const MIN = 34, MAX = 240;
  let lo = MIN, hi = MAX, best = MIN;
  for (let i = 0; i < 20; i++) {
    const mid = (lo + hi) / 2;
    box.style.fontSize = mid + "px";
    if (fits()) { best = mid; lo = mid; } else { hi = mid; }
  }
  box.style.fontSize = best + "px";
}

function render() {
  renderMeta();
  switch (game.state) {
    case State.TITLE: viewTitle(); break;
    case State.ROUND_INTRO: viewRoundIntro(); break;
    case State.QUESTION: viewQuestion(); break;
    case State.TURN_IN: viewTurnIn(); break;
    case State.ANSWER: viewAnswer(); break;
    case State.FINAL_BOARD: viewFinalBoard(); break;
    case State.WINNER: viewWinner(); break;
    case State.ROUND_END: viewRoundEnd(); break;
    case State.END: viewEnd(); break;
  }
  // If we're hosting a live session, broadcast the new state to all displays.
  if (live.role === "host" && !live.applying) pushState();
  // On TV displays, show/hide the injected instructions + QR per screen.
  updateTvChromeVisibility();
}

// The element that hosts all on-screen UI (the scaled 1920×1080 stage). Overlays
// (live banner, room tag, leaderboard takeover) are appended here, not to <body>,
// so they scale and position with everything else.
function stageEl() { return document.getElementById("app") || document.body; }

// Scale the 1920×1080 stage to fit the current screen — keeps the layout identical
// (and overlap-free) on a laptop, a 1080p TV, or a 720p TV.
function fitStage() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.documentElement.style.setProperty("--scale", String(s));
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", fitStage);
fitStage();

// Re-fit the answer list / question text when the window/preview is resized.
window.addEventListener("resize", () => {
  if (game.state === State.ROUND_END) fitAnswers();
  if (game.state === State.QUESTION) fitQuestion();
});
// Re-fit once the custom web font has loaded (its metrics differ from the fallback).
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    if (game.state === State.QUESTION) fitQuestion();
    if (game.state === State.ROUND_END) fitAnswers();
  });
}

function advance() {
  if (live.role === "display") return;   // mirroring screens are view-only
  gotoCursor(game.cursor + 1);
}

function goBack() {
  if (live.role === "display") return;   // mirroring screens are view-only
  gotoCursor(game.cursor - 1);
}

function backToMenu() {
  if (confirm("Return to title screen? Progress will be lost.")) {
    gotoCursor(0);
  }
}

// INPUT
// ============================================================
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  // Let typing flow normally into form fields (e.g. the TV code box).
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (document.getElementById("loadModal")) {
    if (e.key === "Escape") {
      e.preventDefault();
      closeLoadModal();
    }
    return;
  }
  // On any TV / display screen, the only key that does anything is fullscreen.
  if (document.body.classList.contains("display-mode")) {
    if (e.key === "f" || e.key === "F") { e.preventDefault(); toggleFullscreen(); }
    return;
  }
  switch (e.key) {
    case " ":
    case "ArrowRight":
    case "Enter":
      e.preventDefault();
      advance();
      break;
    case "ArrowLeft":
      e.preventDefault();
      goBack();
      break;
    case "f":
    case "F":
      e.preventDefault();
      toggleFullscreen();
      break;
    case "l":
    case "L":
      if (game.state === State.TITLE) {
        e.preventDefault();
        openLoadModal();
      }
      break;
    case "Escape":
      e.preventDefault();
      if (game.state !== State.TITLE) backToMenu();
      break;
  }
});

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}

function loadRounds() {

    if (!raw) return DEFAULT_ROUNDS;
    const parsed = JSON.parse(raw);
    if (validateRounds(parsed)) return normalizeRounds(parsed);
  } catch (e) { /* fall through */ }
  return DEFAULT_ROUNDS;
}

function saveRounds(rounds) {

}

function clearStoredRounds() {
  localStorage.removeItem(STORAGE_KEY);

// Internal shape: { category, questions: [{q, a}] }
function validateRounds(data) {
  if (!Array.isArray(data) || data.length === 0) {
    throw new Error("Must be a non-empty list of categories.");
  }
  for (let i = 0; i < data.length; i++) {
    const r = data[i];
    if (!r || typeof r.category !== "string" || !r.category.trim()) {
      throw new Error(`Category ${i + 1}: missing or empty 'category' name.`);
    }
    if (!Array.isArray(r.questions) || r.questions.length === 0) {
      throw new Error(`Category "${r.category}": needs at least one question.`);
    }
    for (let j = 0; j < r.questions.length; j++) {
      const q = r.questions[j];
      if (typeof q === "string") {
        if (!q.trim()) throw new Error(`Category "${r.category}", question ${j + 1}: empty.`);
      } else if (q && typeof q === "object") {
        if (typeof q.q !== "string" || !q.q.trim()) {
          throw new Error(`Category "${r.category}", question ${j + 1}: missing 'q' text.`);
        }
        if (q.a !== undefined && q.a !== null && typeof q.a !== "string") {
          throw new Error(`Category "${r.category}", question ${j + 1}: 'a' must be a string.`);
        }
      } else {
        throw new Error(`Category "${r.category}", question ${j + 1}: must be a string or {q, a} object.`);
      }
    }
  }
  return true;
}

function normalizeRounds(data) {
  return data.map(r => ({
    category: r.category.trim(),
    questions: r.questions.map(q => {
      if (typeof q === "string") return { q: q.trim(), a: "" };
      return { q: (q.q || "").trim(), a: (q.a || "").trim() };
    })
  }));
}

function parseJsonRounds(text) {
  const parsed = JSON.parse(text);
  validateRounds(parsed);
  return normalizeRounds(parsed);
}

// Text format:
//   ## Category Name
//   Question 1? | Answer
//   Question 2? | Answer
//
//   ## Next Category
//   ...
// The "| Answer" portion is optional. " | " or " :: " both work as separators.
function parseTextRounds(text) {
  const lines = text.split(/\r?\n/);
  const rounds = [];
  let current = null;
  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;
    const catMatch = line.match(/^#{1,3}\s*(.+)$/);
    if (catMatch) {
      current = { category: catMatch[1].trim(), questions: [] };
      rounds.push(current);
    } else {
      if (!current) {
        throw new Error("Text must start with a category header (e.g. '## Sports') before any questions.");
      }
      // Split question/answer on " | " (preferred) or " :: "
      let q = line, a = "";
      const sepMatch = line.match(/^(.*?)\s*(?:\||::)\s*(.+)$/);
      if (sepMatch) {
        q = sepMatch[1].trim();
        a = sepMatch[2].trim();
      }
      current.questions.push({ q, a });
    }
  }
  validateRounds(rounds);
  return normalizeRounds(rounds);
}

// CSV format (one question per row):
//   Category,Question,Answer
//   Sports,How many players on a soccer team?,11
//   Sports,"What sport uses ""love"" for zero?",Tennis
// A header row (Category/Question/Answer) is optional and auto-detected.
// Rows are grouped into categories in the order they first appear. Answer is optional.
function parseCsvCells(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }   // escaped quote ""
        else inQuotes = false;
      } else { field += c; }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\r") {
      // ignore — newline handled on \n
    } else if (c === "\n") {
      row.push(field); rows.push(row); row = []; field = "";
    } else {
      field += c;
    }
  }
  row.push(field); rows.push(row);
  // Drop rows that are completely empty.
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function parseCsvRounds(text) {
  const rows = parseCsvCells(text);
  if (!rows.length) throw new Error("The CSV is empty.");
  // Auto-detect and skip a header row.
  let start = 0;
  const first = rows[0].map(s => s.trim().toLowerCase());
  if (first.some(h => /^(category|categories|cat|question|questions|q|answer|answers|a)$/.test(h))) start = 1;
  const byCat = new Map();
  const order = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    const category = (r[0] || "").trim();
    const q = (r[1] || "").trim();
    const a = (r[2] || "").trim();
    if (!category && !q) continue;             // blank line
    if (!category) throw new Error("Row " + (i + 1) + ': needs a category in the first column.');
    if (!q) continue;                          // category but no question — skip the row
    if (!byCat.has(category)) { byCat.set(category, []); order.push(category); }
    byCat.get(category).push({ q, a });
  }
  const rounds = order.map(cat => ({ category: cat, questions: byCat.get(cat) }));
  validateRounds(rounds);
  return normalizeRounds(rounds);
}

function applyRounds(rounds) {
  saveRounds(rounds);
  ROUNDS = rounds;
  buildSchedule();
  gotoCursor(0);   // back to the title with the new question set
}

// ---- BUILD-YOUR-OWN sheet (set # of categories & questions, type them in) ----
function blankQ() { return { q: "", a: "" }; }
function clampInt(v, lo, hi) { let n = parseInt(v, 10); if (isNaN(n)) n = lo; return Math.max(lo, Math.min(hi, n)); }

function seedBuilderData() {
  // Seed from the questions currently in play so the host can tweak them,
  // falling back to the built-in defaults.
  const src = (ROUNDS && ROUNDS.length) ? ROUNDS : DEFAULT_ROUNDS;
  BUILDER_DATA = src.map(r => ({
    category: r.category || "",
    questions: (r.questions || []).map(q => ({ q: q.q || "", a: q.a || "" }))
  }));
  if (!BUILDER_DATA.length) BUILDER_DATA = [{ category: "", questions: [blankQ()] }];
}

// Read the live grid inputs back into BUILDER_DATA (so edits survive a resize/apply).
function readBuilderDOM() {
  const grid = document.getElementById("builderGrid");
  if (!grid) return;
  BUILDER_DATA = [...grid.querySelectorAll(".bld-cat")].map(catEl => ({
    category: catEl.querySelector(".bld-catname").value,
    questions: [...catEl.querySelectorAll(".bld-qrow")].map(row => ({
      q: row.querySelector(".bld-q").value,
      a: row.querySelector(".bld-a").value
    }))
  }));
}

function syncCountInputs() {
  const ci = document.getElementById("bldCats"), qi = document.getElementById("bldQs");
  if (!ci || !qi || !BUILDER_DATA) return;
  ci.value = BUILDER_DATA.length || 1;
  qi.value = BUILDER_DATA.reduce((m, c) => Math.max(m, c.questions ? c.questions.length : 0), 0) || 1;
}

// Apply the two number inputs: add/remove categories & question rows, keeping what's there.
function resizeBuilder() {
  readBuilderDOM();
  if (!BUILDER_DATA) BUILDER_DATA = [];
  const nCats = clampInt(document.getElementById("bldCats").value, 1, 40);
  const nQs = clampInt(document.getElementById("bldQs").value, 1, 100);
  document.getElementById("bldCats").value = nCats;
  document.getElementById("bldQs").value = nQs;
  while (BUILDER_DATA.length < nCats) BUILDER_DATA.push({ category: "", questions: [] });
  BUILDER_DATA.length = nCats;
  BUILDER_DATA.forEach(c => {
    if (!c.questions) c.questions = [];
    while (c.questions.length < nQs) c.questions.push(blankQ());
    c.questions.length = nQs;
  });
  renderBuilder();
}

function updateBuilderTotal() {
  const el = document.getElementById("bldTotal");
  if (!el || !BUILDER_DATA) return;
  const cats = BUILDER_DATA.length;
  const total = BUILDER_DATA.reduce((n, c) => n + (c.questions ? c.questions.length : 0), 0);
  el.textContent = "= " + total + " question" + (total === 1 ? "" : "s") + " · " + cats + " categor" + (cats === 1 ? "y" : "ies");
}

function renderBuilder() {
  const grid = document.getElementById("builderGrid");
  if (!grid || !BUILDER_DATA) return;
  grid.innerHTML = BUILDER_DATA.map((c, ci) =>
    '<div class="bld-cat">' +
      '<div class="bld-cat-head">' +
        '<span class="bld-cat-no">CATEGORY ' + (ci + 1) + '</span>' +
        '<input type="text" class="bld-catname" placeholder="Category name (e.g. Sports)" value="' + escapeHtml(c.category) + '" />' +
      '</div>' +
      (c.questions || []).map((q, qi) =>
        '<div class="bld-qrow">' +
          '<span class="bld-qn">' + (qi + 1) + '.</span>' +
          '<input type="text" class="bld-q" placeholder="Question" value="' + escapeHtml(q.q) + '" />' +
          '<input type="text" class="bld-a" placeholder="Answer (optional)" value="' + escapeHtml(q.a) + '" />' +
        '</div>'
      ).join("") +
    '</div>'
  ).join("");
  syncCountInputs();
  updateBuilderTotal();
}

// Turn the grid into a clean rounds array (drops blank rows / empty categories).
function collectBuilderRounds() {
  readBuilderDOM();
  const rounds = (BUILDER_DATA || []).map(c => ({
    category: (c.category || "").trim(),
    questions: (c.questions || [])
      .map(q => ({ q: (q.q || "").trim(), a: (q.a || "").trim() }))
      .filter(q => q.q)
  })).filter(c => c.category || c.questions.length);
  if (!rounds.length) throw new Error("Add at least one category with one question.");
  for (const c of rounds) {
    if (!c.category) throw new Error("Every category needs a name.");
    if (!c.questions.length) throw new Error('Category "' + c.category + '" needs at least one question.');
  }
  return rounds;
}

// Toggle between the builder grid and the upload/paste area based on the active tab.
function setModalMode() {

function _colorField(id, label, val) {
  return '<div class="brand-color"><span>' + label + '</span>' +
    '<input type="color" id="' + id + '" value="' + val + '" /></div>';
}
// Read an uploaded image, shrink it to <=maxDim px, return a PNG data URL.
function _downscaleImage(file, maxDim, cb) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      try { cb(c.toDataURL("image/png")); } catch (err) { cb(null); }
    };
    img.onerror = () => cb(null);
    img.src = e.target.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}

function showModalMsg(text, type) {
  const el = document.getElementById("msgArea");
  if (!el) return;
  el.innerHTML = `<div class="${type === "ok" ? "ok-msg" : "error-msg"}">${escapeHtml(text)}</div>`;
}

function handleFilePicked(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById("pasteArea").value = ev.target.result;
    if (file.name.toLowerCase().endsWith(".json")) {
      modalFormat = "json";
    } else if (file.name.toLowerCase().endsWith(".csv")) {
      modalFormat = "csv";
    } else if (file.name.toLowerCase().endsWith(".txt")) {
      modalFormat = "text";
    }
    document.querySelectorAll(".format-tab").forEach(t => {
      t.classList.toggle("active", t.dataset.fmt === modalFormat);
    });
    updateFormatHelp();
    setModalMode();
    showModalMsg(`Loaded "${file.name}". Review and click APPLY to use these questions.`, "ok");
  };
  reader.onerror = () => showModalMsg("Could not read that file.", "err");
  reader.readAsText(file);
}

function applyFromModal() {
  if (modalFormat === "build") {
    try {
      const parsed = normalizeRounds(collectBuilderRounds());
      validateRounds(parsed);
      applyRounds(parsed);
      const total = parsed.reduce((n, r) => n + r.questions.length, 0);
      showModalMsg("Built " + parsed.length + " categories, " + total + " questions.", "ok");
      setTimeout(() => { closeLoadModal(); render(); }, 600);
    } catch (err) {
      showModalMsg("Could not build: " + err.message, "err");
    }
    return;
  }
  const text = document.getElementById("pasteArea").value.trim();
  if (!text) {
    showModalMsg("Paste questions or pick a file first.", "err");
    return;
  }
  try {
    let parsed;
    if (modalFormat === "json") {
      parsed = parseJsonRounds(text);
    } else if (modalFormat === "csv") {
      parsed = parseCsvRounds(text);
    } else {
      // Auto-detect JSON if text starts with [
      if (text.startsWith("[")) {
        try { parsed = parseJsonRounds(text); }
        catch { parsed = parseTextRounds(text); }
      } else {
        parsed = parseTextRounds(text);
      }
    }
    applyRounds(parsed);
    const total = parsed.reduce((n, r) => n + r.questions.length, 0);
    showModalMsg(`Loaded ${parsed.length} categories, ${total} questions.`, "ok");
    setTimeout(() => {
      closeLoadModal();
      render();
    }, 600);
  } catch (err) {
    showModalMsg("Could not load: " + err.message, "err");
  }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Make a near-white background in the logo transparent at runtime, so the logo
// floats on the page with no white box even if the PNG isn't transparent.
// (Works when the page is served over http — Netlify or a localhost preview.
//  Over file:// the browser blocks reading the pixels, so it leaves it as-is.)
function deWhiteLogo(img) {
  if (!img || img.dataset.dewhited || !img.naturalWidth) return;
  try {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const px = ctx.getImageData(0, 0, c.width, c.height);
    const d = px.data;
    for (let i = 0; i < d.length; i += 4) {
      // Only knock out pixels that are essentially white (keeps yellow/red/blue).
      if (d[i] > 238 && d[i + 1] > 238 && d[i + 2] > 238) d[i + 3] = 0;
    }
    ctx.putImageData(px, 0, 0);
    img.dataset.dewhited = "1";
    img.src = c.toDataURL("image/png");
  } catch (e) {
    /* file:// or cross-origin — leave the logo untouched */
  }
}
function processLogos() {
  document.querySelectorAll(".brand-logo-img, .title-logo-img").forEach((im) => {
    if (im.dataset.dewhited) return;
    // Only auto-knock-out white on the built-in logo. Custom brand logos are left
    // exactly as uploaded (their white may be intentional, e.g. white lettering).
    if (!/pluckers-logo/.test(im.getAttribute("src") || "")) return;
    if (im.complete && im.naturalWidth) deWhiteLogo(im);
    else im.addEventListener("load", () => deWhiteLogo(im), { once: true });
  });
}

function makeRoomCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no ambiguous 0/O/1/I/L
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function tvBaseUrl() {

}
// A URL a phone on another device can't reach (running off your PC, not the web).
function isLocalUrl() {
  const h = location.hostname;
  return location.protocol === "file:" ||
         h === "localhost" || h === "127.0.0.1" || h === "" ||
         h.endsWith(".local") || /^192\.168\./.test(h) || /^10\./.test(h);
}
function snapshot() {
  return {
    room_code: live.code,
    // `state` carries the screen name PLUS timer + published leaderboard so displays mirror them.
    state: JSON.stringify({ st: game.state, timerSecs: TIMER_SECS, timerEnd: TIMER_END, lb: { shown: LB_SHOWN, teams: TEAMS }, theme: THEME }),
    round_idx: game.roundIdx,   // cosmetic
    question_idx: game.cursor,  // the real sync position: index into SCHEDULE

  };

async function startHosting(name) {

  try {
    const { data } = await liveClient().from(LIVE_TABLE).select("updated_at").eq("room_code", name).maybeSingle();
    const inUse = data && data.updated_at && (Date.now() - Date.parse(data.updated_at) < LIVE_TTL_MS);
    if (inUse) return { ok: false, reason: '"' + name + '" is already live right now. Pick another name (or end that game first).' };
  } catch (e) { /* if the check fails, fall through and host anyway */ }

  live.role = "host";
  live.code = name;
  game.cursor = 0;
  applyFrame(SCHEDULE[0]);
  try { localStorage.setItem(LOC_NAME_KEY, name); } catch (e) {}
  try { await liveClient().from(LIVE_TABLE).upsert(snapshot()); } catch (e) {}
  rememberHostSession();
  startHeartbeat();
  render();                 // render() keeps pushing state to this room while hosting

}

  if (live.channel && live.sb) { try { live.sb.removeChannel(live.channel); } catch (e) {} }

async function resumeHostIfAny() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(HOST_RESUME_KEY)); } catch (e) {}
  // Only auto-resume a recent session (within 8 hours) to avoid stale rooms.
  if (!saved || !saved.code || !liveConfigured() || (Date.now() - (saved.t || 0)) > 8 * 3600 * 1000) {
    render();
    return;
  }
  try {
    const { data } = await liveClient().from(LIVE_TABLE).select("*").eq("room_code", saved.code).maybeSingle();
    if (!data) { render(); return; }
    live.role = "host";
    live.code = saved.code;
    // restore the exact position + questions + timer
    if (Array.isArray(data.rounds) && data.rounds.length) { ROUNDS = data.rounds; buildSchedule(); }
    try {
      const ex = JSON.parse(data.state);
      if (typeof ex.timerSecs === "number") TIMER_SECS = ex.timerSecs;
    } catch (e) {}
    game.cursor = Math.max(0, Math.min((data.question_idx | 0), SCHEDULE.length - 1));

async function connectAsDisplay(code) {
