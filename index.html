<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pluckers Trivia</title>
<!-- Load the fonts so the host computer and the TVs render text identically
     (TVs usually don't have Impact, so we ship a web font instead). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c8102e;
    --red-dark: #9a0a22;
    --red-deep: #6b0717;
    --yellow: #f4c430;
    --yellow-bright: #ffd84d;
    --blue: #1d3a8a;
    --blue-dark: #142764;
    --blue-bright: #2a52be;
    --cream: #f7f1e3;
    --black: #0c0c0c;
    --charcoal: #1a1a1a;
    --panel: #222;
    --ink: #fff8e7;
    --ink-dim: #d9c9a0;
    --good: var(--yellow);
    --shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(1400px 900px at 50% -15%, var(--blue-dark) 0%, #0a1234 60%, #060a1f 100%);
    color: var(--ink);
    font-family: "Anton", "Oswald", "Impact", "Bebas Neue", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(244,196,48,.035) 0 14px, transparent 14px 28px);
    pointer-events: none;
    z-index: 0;
  }
  #app {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    z-index: 1;
  }

  /* Header bar */
  header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 36px;
    background: var(--blue-dark);
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  header::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 9px;
    border-top: 2px solid var(--black);
    background: linear-gradient(180deg,
      var(--blue) 0,
      var(--blue) 33.33%,
      var(--yellow) 33.33%,
      var(--yellow) 66.66%,
      var(--red) 66.66%,
      var(--red) 100%);
  }
  header .brand, header .meta { position: relative; z-index: 2; }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    font-weight: 900;
    letter-spacing: 2px;
  }
  .brand .logo {
    width: 64px; height: 64px;
    border-radius: 12px;
    background: var(--cream);
    display: grid;
    place-items: center;
    font-size: 46px;
    font-weight: 900;
    color: var(--red);
    text-shadow: 2px 2px 0 var(--blue);
    box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 -3px 0 rgba(0,0,0,.12);
    border: 3px solid var(--black);
    transform: rotate(-4deg);
  }
  .brand .brand-logo-img {
    height: 72px;
    width: auto;
    max-width: 260px;
    object-fit: contain;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
  }
  .brand .name {
    font-size: 38px;
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--black);
    line-height: 1;
  }
  .brand .name small {
    display: block;
    font-size: 14px;
    color: var(--cream);
    letter-spacing: 6px;
    margin-top: 4px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.2);
  }
  /* "DON'T CHEAT!" badge — centered in the header, shows on every screen. */
  .dont-cheat {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(-2deg);
    background: var(--red);
    color: var(--yellow);
    border: 3px solid var(--black);
    border-radius: 12px;
    padding: 6px 22px;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--black);
    white-space: nowrap;
    z-index: 3;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  @media (max-width: 760px) {
    .dont-cheat { font-size: 15px; padding: 4px 12px; }
  }
  .meta {
    display: flex;
    gap: 14px;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--blue);
  }
  .meta .chip {
    background: var(--cream);
    border: 3px solid var(--blue);
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 900;
    color: var(--red);
  }
  .meta .chip b { color: var(--blue); }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    min-height: 0;
  }
  .view {
    width: 100%;
    max-width: 1500px;
    text-align: center;
  }

  /* Title screen */
  .title-wrap { padding: 40px 0; }
  .title-logo {
    position: relative;
    width: 320px; height: 200px;
    margin: 0 auto 24px;
    border-radius: 18px;
    background:
      linear-gradient(135deg,
        var(--red) 0,
        var(--red) 11.5%, var(--black) 11.5%, var(--black) 12.5%,
        var(--blue) 12.5%, var(--blue) 26%, var(--black) 26%, var(--black) 27%,
        var(--yellow) 27%, var(--yellow) 73%, var(--black) 73%, var(--black) 74%,
        var(--blue) 74%, var(--blue) 87.5%, var(--black) 87.5%, var(--black) 88.5%,
        var(--red) 88.5%, var(--red) 100%
      );
    display: grid;
    place-items: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    border: 6px solid var(--black);
  }
  .title-logo .logo-p {
    font-size: 140px;
    font-weight: 900;
    color: var(--red);
    line-height: 1;
    text-shadow:
      4px 4px 0 var(--blue),
      8px 8px 0 var(--black);
  }
  .title-logo-img {
    display: block;
    width: auto;
    max-width: min(775px, 90vw);
    max-height: 350px;
    margin: 0 auto 24px;
    filter: drop-shadow(0 18px 32px rgba(0,0,0,.6));
  }
  h1.title {
    font-size: 130px;
    line-height: .95;
    margin: 0 0 8px;
    color: var(--red);
    text-shadow:
      5px 5px 0 var(--yellow),
      10px 10px 0 var(--blue),
      14px 14px 0 var(--black);
    letter-spacing: 4px;
  }
  h1.title .sub {
    display: block;
    font-size: 80px;
    color: var(--yellow);
    text-shadow:
      4px 4px 0 var(--blue),
      8px 8px 0 var(--black);
    letter-spacing: 14px;
    margin-top: 8px;
  }
  .lead {
    color: var(--ink);
    font-size: 30px;
    margin: 22px auto 32px;
    max-width: 960px;
    letter-spacing: 2px;
    line-height: 1.5;
  }
  .lead b { color: var(--yellow); }
  .win-prizes {
    position: fixed;
    left: 72px;
    top: 50%;
    transform: translateY(-50%) rotate(-8deg);
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, var(--yellow-bright), var(--yellow) 70%);
    border: 8px solid var(--red);
    box-shadow: 0 0 0 6px var(--blue), 0 18px 40px rgba(0,0,0,.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: .9;
    z-index: 5;
  }
  .win-prizes .wp-top {
    color: var(--blue);
    font-size: 50px;
    font-weight: 900;
    letter-spacing: 4px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }
  .win-prizes .wp-big {
    color: var(--red);
    font-size: 70px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 var(--black);
  }
  .instructions {
    position: fixed;
    right: 36px;
    top: 50%;
    transform: translateY(-50%) rotate(2deg);
    width: 460px;
    background: #ffffff;
    border: 6px solid var(--red);
    border-radius: 18px;
    box-shadow: 0 0 0 7px var(--blue), 0 20px 46px rgba(0,0,0,.55);
    padding: 0 0 26px;
    text-align: left;
    overflow: hidden;
    z-index: 5;
  }
  .instructions .instr-header {
    background: var(--red);
    color: var(--yellow);
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 16px 18px;
    text-align: center;
    text-shadow: 2px 2px 0 var(--black);
    border-bottom: 5px solid var(--black);
  }
  .instructions .instr-list {
    margin: 26px 0 0;
    padding: 0 28px 0 62px;
    color: var(--blue-dark);
  }
  .instructions .instr-list li {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 22px;
    letter-spacing: .3px;
  }
  .instructions .instr-list li:last-child { margin-bottom: 0; }
  .instructions .instr-list li b { color: var(--red); }

  /* Host's HOST GUIDE panel — more compact than the TVs' player instructions */
  #main .instructions {
    width: 440px;
    top: 128px; bottom: 64px; height: auto;   /* sits between the header & footer stripes */
    transform: none;                          /* no tilt → corners can't poke into the lines */
    display: flex; flex-direction: column; padding-bottom: 0;
  }
  #main .instructions .instr-header { font-size: 44px; padding: 22px 16px; flex: 0 0 auto; }
  #main .instructions .instr-list { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; margin: 0; padding: 16px 30px 16px 58px; }
  #main .instructions .instr-list li { font-size: 36px; margin: 0; line-height: 1.25; }

  @media (max-width: 1100px) {
    .win-prizes { width: 150px; height: 150px; left: 16px; border-width: 6px; }
    .win-prizes .wp-top { font-size: 28px; }
    .win-prizes .wp-big { font-size: 38px; }
    .instructions { width: 320px; right: 14px; }
    .instructions .instr-header { font-size: 30px; }
    .instructions .instr-list { padding: 0 18px 0 46px; }
    .instructions .instr-list li { font-size: 22px; margin-bottom: 16px; }
  }

  .grab-sheet {
    display: inline-block;
    margin: 24px auto 8px;
    padding: 18px 42px;
    background: var(--yellow);
    color: var(--red);
    border: 4px solid var(--black);
    border-radius: 14px;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--blue);
    box-shadow: 0 8px 0 var(--blue-dark), 0 14px 26px rgba(0,0,0,.5);
    transform: rotate(-2deg);
  }

  /* Buttons */
  .btn {
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    color: var(--cream);
    border: 4px solid var(--black);
    border-radius: 14px;
    padding: 22px 48px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 10px 0 var(--blue-dark), 0 18px 30px rgba(0,0,0,.5);
    transition: transform .08s ease, box-shadow .12s ease, filter .15s ease;
    font-family: inherit;
    text-transform: uppercase;
    text-shadow: 2px 2px 0 var(--black);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active {
    transform: translateY(6px);
    box-shadow: 0 4px 0 var(--blue-dark), 0 8px 16px rgba(0,0,0,.5);
  }
  .btn.ghost {
    background: transparent;
    color: var(--yellow);
    border-color: var(--yellow);
    box-shadow: none;
    text-shadow: none;
  }
  .btn-row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }

  .hint {
    margin-top: 28px;
    color: var(--cream);
    font-size: 16px;
    letter-spacing: 2px;
  }
  .hint kbd {
    display: inline-block;
    background: var(--yellow);
    color: var(--red);
    border: 2px solid var(--black);
    border-bottom-width: 4px;
    border-radius: 6px;
    padding: 4px 10px;
    margin: 0 4px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
  }

  /* Round intro */
  @keyframes round-label-in {
    0%   { opacity: 0; transform: translateY(-24px); letter-spacing: 4px; }
    100% { opacity: 1; transform: translateY(0); letter-spacing: 18px; }
  }
  @keyframes round-number-pop {
    0%   { opacity: 0; transform: scale(.4) rotate(-8deg); }
    60%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes round-rise {
    0%   { opacity: 0; transform: translateY(28px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .round-intro {
    padding: 40px;
  }
  .round-label {
    font-size: 48px;
    letter-spacing: 18px;
    color: var(--cream);
    text-shadow: 3px 3px 0 var(--blue);
    margin-bottom: 8px;
    animation: round-label-in .35s ease-out both;
  }
  .round-number {
    font-size: 220px;
    line-height: 1;
    color: var(--yellow);
    text-shadow:
      6px 6px 0 var(--red),
      12px 12px 0 var(--blue),
      18px 18px 0 var(--black);
    margin: 0;
    animation: round-number-pop .5s cubic-bezier(.2,.8,.3,1.2) .12s both;
  }
  .round-category {
    font-size: 84px;
    color: var(--red);
    text-shadow:
      4px 4px 0 var(--yellow),
      8px 8px 0 var(--black);
    margin: 16px 0 8px;
    letter-spacing: 6px;
    animation: round-rise .4s ease-out .42s both;
  }
  .round-count {
    font-size: 26px;
    color: var(--cream);
    letter-spacing: 4px;
    margin-bottom: 32px;
    animation: round-rise .4s ease-out .55s both;
  }

  /* Question screen */
  .q-screen {
    display: flex;
    flex-direction: column;
    gap: 18px;
    height: 100%;
    position: relative;   /* anchor for the host scoreboard panel */
  }
  /* Host-only scoreboard panel — top-center of the question screen (between the
     QUESTION badge and the category). Hidden on the TVs. */
  .q-topbar-left { display: flex; align-items: center; gap: 16px; }
  .q-score {
    position: absolute;
    top: -16px; left: 50%; transform: translateX(-50%);
    z-index: 6;
    background: var(--yellow); color: var(--red);
    border: 4px solid var(--black); border-radius: 12px;
    font-size: 32px; font-weight: 900; letter-spacing: 2px;
    padding: 16px 80px; white-space: nowrap; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.45);
  }
  body.display-mode .q-score { display: none; }
  .q-main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }
  .q-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    animation: q-badge-drop .3s ease-out both;
  }
  .q-badge {
    background: var(--blue);
    border: 4px solid var(--black);
    border-radius: 12px;
    padding: 10px 24px;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--black);
  }
  .q-category {
    background: var(--red);
    border: 4px solid var(--black);
    border-radius: 12px;
    padding: 10px 24px;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--black);
  }
  @keyframes q-enter {
    0%   { opacity: 0; transform: translateX(48px) scale(.97); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes q-badge-drop {
    0%   { opacity: 0; transform: translateY(-16px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .q-text {
    animation: q-enter .3s cubic-bezier(.2,.7,.3,1) both;
    font-size: 92px;
    line-height: 1.18;
    color: var(--cream);
    background: linear-gradient(180deg, var(--blue-dark), #0a1234);
    border: 5px solid var(--yellow);
    border-radius: 22px;
    padding: 40px 50px;
    box-shadow: var(--shadow);
    letter-spacing: 1px;
  }
  .q-text .q-num {
    display: inline-block;
    background: var(--yellow);
    color: var(--red);
    border: 3px solid var(--black);
    border-radius: 12px;
    padding: 4px 18px;
    margin-right: 18px;
    font-size: 76px;
    vertical-align: middle;
    text-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .choice {
    display: flex;
    align-items: center;
    gap: 22px;
    background: var(--cream);
    border: 4px solid var(--black);
    border-radius: 16px;
    padding: 22px 28px;
    font-size: 34px;
    text-align: left;
    color: var(--blue-dark);
    transition: transform .15s, border-color .15s, background .25s;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  .choice .letter {
    flex: 0 0 70px;
    height: 70px;
    border-radius: 14px;
    background: var(--red);
    color: var(--cream);
    display: grid;
    place-items: center;
    font-size: 42px;
    font-weight: 900;
    text-shadow: 2px 2px 0 var(--black);
    border: 3px solid var(--black);
  }
  .choice:nth-child(2) .letter,
  .choice:nth-child(3) .letter {
    background: var(--blue);
  }
  .choice.reveal-correct {
    background: linear-gradient(180deg, var(--yellow-bright), var(--yellow));
    border-color: var(--red);
    transform: scale(1.03);
    box-shadow: 0 10px 30px rgba(244,196,48,.5), 0 0 0 4px var(--blue) inset;
  }
  .choice.reveal-correct .letter {
    background: var(--red);
    color: var(--cream);
    border-color: var(--black);
  }
  .choice.reveal-correct .choice-text {
    color: var(--red);
    font-weight: 900;
    text-shadow: 1px 1px 0 rgba(0,0,0,.1);
  }
  .choice.reveal-dim {
    opacity: .35;
  }

  /* Answer reveal banner */
  .reveal-banner {
    margin-top: 12px;
    font-size: 36px;
    color: var(--yellow);
    letter-spacing: 4px;
    text-shadow:
      3px 3px 0 var(--red),
      6px 6px 0 var(--black);
    animation: pop .35s ease;
  }
  @keyframes pop {
    0% { transform: scale(.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Round end */
  .round-end h2 {
    font-size: 100px;
    color: var(--red);
    text-shadow:
      6px 6px 0 var(--yellow),
      12px 12px 0 var(--blue),
      18px 18px 0 var(--black);
    margin: 0 0 20px;
    letter-spacing: 4px;
  }
  .round-end .answers-list {
    background: var(--cream);
    border: 5px solid var(--blue);
    border-radius: 18px;
    padding: 30px;
    margin: 24px auto;
    max-width: 1100px;
    box-shadow: var(--shadow);
    text-align: left;
  }
  .answers-list ol {
    columns: 2;
    column-gap: 60px;
    margin: 0;
    padding-left: 24px;
    font-size: 26px;
    line-height: 1.7;
    color: var(--blue-dark);
  }
  .answers-list ol b { color: var(--red); }

  /* End screen */
  .end h2 {
    font-size: 110px;
    color: var(--red);
    text-shadow:
      6px 6px 0 var(--yellow),
      12px 12px 0 var(--blue),
      18px 18px 0 var(--black);
    margin: 0 0 20px;
    letter-spacing: 6px;
  }
  .end p {
    font-size: 30px;
    color: var(--cream);
    letter-spacing: 3px;
    margin-bottom: 36px;
  }

  /* Footer */
  footer {
    position: relative;
    padding: 14px 32px;
    background: var(--blue-dark);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--cream);
  }
  footer::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 9px;
    border-bottom: 2px solid var(--black);
    background: linear-gradient(180deg,
      var(--red) 0,
      var(--red) 33.33%,
      var(--yellow) 33.33%,
      var(--yellow) 66.66%,
      var(--blue) 66.66%,
      var(--blue) 100%);
  }
  footer .controls span { margin-right: 18px; }
  footer kbd {
    background: var(--cream);
    color: var(--red);
    border: 1px solid var(--black);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 2px 8px;
    margin: 0 2px;
    font-family: inherit;
    font-weight: 900;
  }

  /* Round-end answer review */
  .round-end-answers {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-height: calc(100vh - 200px);
    gap: 14px;
    text-align: center;
  }
  .round-end-header h2 {
    font-size: 56px;
    margin: 0 0 4px;
  }
  .round-end-answers .round-category {
    text-shadow: 3px 3px 0 var(--yellow), 5px 5px 0 var(--black);
  }
  .qa-list {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--cream);
    border: 5px solid var(--blue);
    border-radius: 18px;
    padding: 18px 26px;
    box-shadow: var(--shadow);
    text-align: left;
    color: var(--blue-dark);
  }
  .qa-list ol {
    list-style: none;
    margin: 0;
    padding: 0;
    columns: 2;
    column-gap: 40px;
    column-rule: 2px dashed rgba(29,58,138,.25);
  }
  /* Font sizes are driven by a base font-size set on .qa-list by JS (auto-fit).
     Everything below is in em so the whole list scales together. */
  .qa-list { font-size: 40px; }
  .qa-item {
    break-inside: avoid;
    page-break-inside: avoid;
    padding: .3em 0;
    border-bottom: 1px dashed rgba(29,58,138,.15);
  }
  .qa-item:last-child { border-bottom: 0; }
  .qa-q {
    font-weight: 900;
    color: var(--blue-dark);
    line-height: 1.15;
    font-size: 1em;
  }
  .qa-num {
    display: inline-block;
    color: var(--red);
    margin-right: .2em;
    font-weight: 900;
  }
  .qa-a {
    color: var(--red);
    margin-top: .05em;
    line-height: 1.12;
    padding-left: .1em;
    font-size: .86em;
  }
  .qa-a b {
    color: var(--blue);
    letter-spacing: 1px;
    margin-right: 4px;
    font-size: .85em;
  }

  .round-end-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    padding-top: 4px;
  }
  .round-end-footer .lead-inline {
    color: var(--cream);
    font-size: 22px;
    letter-spacing: 3px;
  }

  /* Status pill on title screen */
  .status-pill {
    display: inline-block;
    background: var(--cream);
    color: var(--blue-dark);
    border: 4px solid var(--blue);
    border-radius: 999px;
    padding: 14px 36px;
    font-size: 30px;
    letter-spacing: 2px;
    margin: 0 0 24px;
    font-weight: 900;
  }
  .status-pill b { color: var(--red); }
  .status-pill.custom { border-color: var(--red); }
  .status-pill.custom b { color: var(--blue); }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 31, .85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
    overflow-y: auto;
  }
  .modal {
    background: var(--cream);
    color: var(--blue-dark);
    border: 6px solid var(--blue);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    width: 100%;
    max-width: 720px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 28px 32px;
    position: relative;
  }
  .modal::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 14px;
    background: linear-gradient(180deg,
      var(--red) 0,
      var(--red) 50%,
      var(--yellow) 50%,
      var(--yellow) 100%);
    border-radius: 14px 14px 0 0;
  }
  .modal h2 {
    margin: 18px 0 6px;
    color: var(--red);
    font-size: 38px;
    letter-spacing: 3px;
    text-shadow: 2px 2px 0 var(--yellow);
  }
  .modal .modal-lead {
    color: var(--blue-dark);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 20px;
    letter-spacing: 1px;
  }
  .modal .field {
    margin-bottom: 20px;
  }
  .modal label {
    display: block;
    font-size: 16px;
    color: var(--red);
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-weight: 900;
  }
  .modal input[type="file"] {
    display: block;
    width: 100%;
    padding: 10px;
    background: #fff;
    border: 2px dashed var(--blue);
    border-radius: 8px;
    font-family: inherit;
    color: var(--blue-dark);
  }
  .modal textarea {
    width: 100%;
    min-height: 180px;
    padding: 14px;
    background: #fff;
    border: 2px solid var(--blue);
    border-radius: 8px;
    font-family: ui-monospace, "Consolas", "Courier New", monospace;
    font-size: 14px;
    color: var(--blue-dark);
    resize: vertical;
    line-height: 1.5;
  }
  .modal textarea:focus, .modal input[type="file"]:focus {
    outline: none;
    border-color: var(--red);
  }
  .format-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 12px;
    border-bottom: 3px solid var(--blue);
  }
  .format-tab {
    background: transparent;
    border: 0;
    border-bottom: 4px solid transparent;
    margin-bottom: -3px;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: 900;
    color: var(--blue);
    cursor: pointer;
  }
  .format-tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
  }
  .format-help {
    background: rgba(29, 58, 138, .08);
    border-left: 4px solid var(--blue);
    padding: 10px 14px;
    margin: 0 0 10px;
    font-size: 13px;
    font-family: ui-monospace, "Consolas", "Courier New", monospace;
    color: var(--blue-dark);
    white-space: pre;
    overflow-x: auto;
    border-radius: 0 6px 6px 0;
  }
  .modal-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 2px solid rgba(29, 58, 138, .2);
  }
  .modal .btn {
    padding: 14px 28px;
    font-size: 18px;
    box-shadow: 0 6px 0 var(--blue-dark);
  }
  .modal .btn:active {
    box-shadow: 0 2px 0 var(--blue-dark);
  }
  .modal .btn.secondary {
    background: var(--cream);
    color: var(--blue);
    border-color: var(--blue);
    text-shadow: none;
    box-shadow: 0 6px 0 var(--blue-dark);
  }
  .modal .btn.danger {
    background: var(--yellow);
    color: var(--red);
    text-shadow: none;
  }
  .modal .error-msg {
    background: var(--red);
    color: var(--cream);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    border: 2px solid var(--black);
  }
  .modal .ok-msg {
    background: var(--blue);
    color: var(--yellow);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    border: 2px solid var(--black);
  }
  .modal .close-x {
    position: absolute;
    top: 22px;
    right: 18px;
    background: transparent;
    border: 0;
    color: var(--blue);
    font-size: 28px;
    font-weight: 900;
    cursor: pointer;
    line-height: 1;
    padding: 4px 10px;
    z-index: 2;
  }
  .modal .close-x:hover { color: var(--red); }

  @media (max-width: 900px) {
    h1.title { font-size: 80px; }
    h1.title .sub { font-size: 50px; letter-spacing: 8px; }
    .q-text { font-size: 36px; padding: 28px; }
    .choice { font-size: 24px; padding: 18px; }
    .choice .letter { flex-basis: 54px; height: 54px; font-size: 32px; }
    .choices { grid-template-columns: 1fr; }
    .round-number { font-size: 140px; }
    .round-category { font-size: 56px; letter-spacing: 4px; }
    .answers-list ol { columns: 1; font-size: 22px; }
  }
  /* ---- Live multi-screen sync ---- */
  #liveBanner {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--blue-dark);
    border: 3px solid var(--yellow);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
    color: var(--cream);
    max-width: 420px;
  }
  #liveBanner .lb-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #2ed573; flex: 0 0 auto;
    box-shadow: 0 0 0 0 rgba(46,213,115,.7);
    animation: lb-pulse 1.6s infinite;
  }
  @keyframes lb-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(46,213,115,.6); }
    70%  { box-shadow: 0 0 0 12px rgba(46,213,115,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,213,115,0); }
  }
  #liveBanner .lb-info { text-align: left; min-width: 0; }
  #liveBanner .lb-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
  #liveBanner .lb-title b { color: var(--yellow); font-size: 22px; letter-spacing: 3px; }
  #liveBanner .lb-url { font-size: 11px; color: #9fb6c8; word-break: break-all; margin-top: 2px; }
  #liveBanner .lb-code { font-size: 44px; font-weight: 900; color: var(--yellow); letter-spacing: 8px; line-height: 1; margin: 4px 0 2px; }
  #liveBanner .lb-howto { font-size: 11px; color: #cfe8ff; margin-top: 4px; line-height: 1.4; max-width: 240px; }
  #liveBanner .lb-howto b { color: #fff; }
  #liveBanner .lb-warn { font-size: 11px; color: var(--yellow); margin-top: 6px; line-height: 1.35; max-width: 240px; }
  #liveBanner .lb-warn b { color: #fff; }

  /* TV "enter room code" setup screen */
  .code-entry { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 40px; }
  .code-entry .ce-title { font-size: 64px; color: var(--yellow); margin: 0; letter-spacing: 6px; text-shadow: 3px 3px 0 var(--blue); }
  .code-entry .ce-sub { font-size: 26px; color: var(--cream); margin: 0; }
  .code-entry .ce-input {
    font-size: 90px; font-weight: 900; letter-spacing: 20px; text-align: center;
    width: 460px; max-width: 90vw; padding: 18px 10px 18px 30px;
    border-radius: 16px; border: 5px solid var(--yellow); background: var(--cream);
    color: var(--blue-dark); text-transform: uppercase;
  }
  .code-entry .ce-input:focus { outline: none; border-color: var(--red); }
  .code-entry .ce-err { color: var(--yellow); font-size: 20px; min-height: 22px; margin: 0; }

  /* "How to play" line under the question — TV displays only (for mid-game joiners). */
  .q-howto { display: none; }
  body.display-mode .q-howto {
    display: block;
    align-self: center;
    max-width: 1280px;
    margin-top: 6px;
    font-size: 40px;
    font-weight: 800;
    line-height: 1.3;
    text-align: center;
    color: var(--cream);
    background: rgba(20,39,100,.55);
    border: 2px solid var(--black);
    border-radius: 16px;
    padding: 18px 32px;
  }

  /* "TURN IN YOUR ANSWER SHEET!" — shown after the last question of each round */
  .turn-in { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; height: 100%; }
  .turn-in .turn-in-big {
    font-size: 130px;
    line-height: 1.02;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--red);
    text-shadow: 4px 4px 0 var(--yellow), 8px 8px 0 var(--black);
    animation: turnin-pop .45s cubic-bezier(.2,.8,.3,1.2) both;
  }
  .turn-in .turn-in-sub { font-size: 34px; color: var(--cream); letter-spacing: 2px; }
  @keyframes turnin-pop {
    0%   { opacity: 0; transform: scale(.7); }
    60%  { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  #liveBanner .lb-qr { background: #fff; padding: 5px; border-radius: 8px; flex: 0 0 auto; }
  #liveBanner .lb-qr img, #liveBanner .lb-qr canvas { display: block; }
  #liveBanner .lb-stop {
    flex: 0 0 auto; padding: 8px 12px; border: none; border-radius: 8px;
    background: var(--red); color: #fff; font-weight: 800; cursor: pointer; font-size: 12px;
  }
  #displayTag {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 50;
    background: rgba(20,39,100,.85);
    border: 2px solid var(--yellow);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px; font-weight: 800; letter-spacing: 2px;
    color: var(--yellow);
  }
  /* ---- TV / display mode: clean board, no controls ---- */
  /* Hide every interactive / host-only element inside the mirrored views. */
  body.display-mode #main .btn-row,
  body.display-mode #main .hint,
  body.display-mode #main .setup-row,
  body.display-mode #main .win-prizes,
  body.display-mode #main .instructions,
  body.display-mode #main .round-end-footer .btn,
  body.display-mode #meta,
  body.display-mode footer .controls { display: none; }

  /* Persistent instructions panel injected on TVs (lives outside #main so it
     survives re-renders). Reuses the .instructions look. */
  #tvInstructions { /* positioning inherited from .instructions */ }
  /* Title setup row (timer) */
  .setup-row { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .setup-label { color: var(--cream); font-weight: 800; font-size: 18px; letter-spacing: 1px; }
  .timer-input {
    width: 92px; font-size: 22px; padding: 8px 10px; border-radius: 10px;
    border: 2px solid var(--yellow); background: var(--cream); color: var(--blue-dark);
    text-align: center; font-weight: 800;
  }
  .timer-input:focus { outline: none; border-color: var(--red); }

  /* Question countdown timer */
  .q-timer {
    background: var(--yellow); color: var(--blue-dark);
    border: 4px solid var(--black); border-radius: 14px;
    padding: 6px 18px; font-size: 40px; font-weight: 900; line-height: 1;
    min-width: 96px; text-align: center;
  }
  .q-timer.q-timer-up { background: var(--red); color: #fff; }
  /* Host title-screen scoreboard box (replaces WIN PRIZES on the host; TVs keep WIN PRIZES) */
  .title-scoreboard {
    position: fixed;
    left: 36px;
    top: 50%;
    transform: translateY(-50%) rotate(-2deg);
    width: 380px;
    max-height: 72vh;
    overflow: hidden;
    background: #ffffff;
    color: var(--blue-dark);
    border: 6px solid var(--red);
    border-radius: 18px;
    box-shadow: 0 0 0 7px var(--blue), 0 20px 46px rgba(0,0,0,.55);
    padding: 0 0 14px;
    text-align: left;
    cursor: pointer;
    z-index: 5;
  }
  body.display-mode .title-scoreboard { display: none; }  /* host only */
  .title-scoreboard .ts-head {
    background: var(--red);
    color: var(--yellow);
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 14px 16px;
    text-align: center;
    text-shadow: 2px 2px 0 var(--black);
    border-bottom: 5px solid var(--black);
  }
  .title-scoreboard .ts-empty { font-size: 19px; text-align: center; line-height: 1.45; padding: 22px 22px 6px; }
  .title-scoreboard .ts-list { display: flex; flex-direction: column; padding: 14px 22px 0; max-height: 50vh; overflow: auto; }
  .title-scoreboard .ts-row { display: flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 800; padding: 8px 0; border-bottom: 1px dashed rgba(29,58,138,.2); }
  .title-scoreboard .ts-row:last-child { border-bottom: 0; }
  .title-scoreboard .ts-rank { color: var(--red); min-width: 32px; }
  .title-scoreboard .ts-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-scoreboard .ts-score { color: var(--blue); font-weight: 900; }
  .title-scoreboard .ts-hint { margin-top: 12px; text-align: center; font-size: 13px; color: rgba(12,12,12,.5); padding: 0 16px; }

  /* Header right cluster + host scoreboard button */
  .header-right { display: flex; align-items: center; gap: 16px; position: relative; z-index: 2; }
  .scorebtn {
    padding: 10px 18px; border-radius: 10px; border: 3px solid var(--black);
    background: var(--yellow); color: var(--red); font-weight: 900;
    font-size: 18px; letter-spacing: 1px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 0 var(--blue-dark);
  }
  .scorebtn:hover { filter: brightness(1.05); }
  body.display-mode .scorebtn { display: none; }   /* TVs never show host controls */

  /* Scoreboard modal rows */
  .sb-status { margin: 6px 0 10px; font-size: 16px; }
  .sb-rows { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow: auto; }
  .sb-row { display: flex; gap: 8px; align-items: center; }
  .sb-name { flex: 1; padding: 10px 12px; border-radius: 8px; border: 2px solid #2a3a4d; background: #0e1826; color: #fff; font: inherit; font-size: 18px; }
  .sb-score { width: 90px; padding: 10px; border-radius: 8px; border: 2px solid var(--yellow); background: var(--cream); color: var(--blue-dark); text-align: center; font-weight: 800; font-size: 18px; }
  .sb-del { width: 40px; height: 40px; border: none; border-radius: 8px; background: var(--red); color: #fff; font-weight: 900; cursor: pointer; }
  .sb-empty { color: #9fb6c8; }

  /* Published leaderboard = a HORIZONTAL banner across the top (fills the empty
     space, sits above the question so it doesn't cover anything). */
  #lbOverlay { display: none; }
  #lbOverlay.show {
    display: block;
    position: fixed; top: 128px; left: 28px; right: 28px; z-index: 60;
  }
  #lbOverlay .lbo-card { display: flex; flex-direction: row; align-items: stretch; gap: 16px; }
  #lbOverlay .lbo-title {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--red); color: var(--yellow);
    border: 4px solid var(--black); border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
    padding: 0 26px; font-size: 36px; font-weight: 900; letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--black); line-height: 1.05; max-width: 320px;
  }
  #lbOverlay .lbo-list { flex: 1; display: flex; flex-direction: row; gap: 16px; }
  #lbOverlay .lbo-row {
    flex: 1; display: flex; align-items: center; gap: 14px;
    background: #ffffff; color: var(--blue-dark);
    border: 4px solid var(--blue); border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
    padding: 14px 24px; min-width: 0;
  }
  #lbOverlay .lbo-row.lbo-first { background: var(--yellow); border-color: var(--red); }
  #lbOverlay .lbo-rank { font-size: 52px; line-height: 1; }
  #lbOverlay .lbo-name { flex: 1; font-size: 42px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lbOverlay .lbo-score { font-size: 54px; font-weight: 900; color: var(--blue); }
  #lbOverlay .lbo-empty { flex: 1; background: #fff; border: 4px solid var(--blue); border-radius: 16px; text-align: center; color: var(--blue-dark); font-size: 28px; padding: 18px; }
  /* Single answer-reveal screen (shown one at a time after each round) */
  .ans-q {
    font-size: 56px;
    line-height: 1.18;
    color: var(--cream);
    background: linear-gradient(180deg, var(--blue-dark), #0a1234);
    border: 5px solid var(--yellow);
    border-radius: 22px;
    padding: 26px 40px;
    letter-spacing: 1px;
    text-align: center;
  }
  .ans-q .q-num {
    display: inline-block;
    background: var(--yellow); color: var(--red);
    border: 3px solid var(--black); border-radius: 12px;
    padding: 2px 14px; margin-right: 14px; font-size: 44px; vertical-align: middle;
  }
  .ans-a {
    margin-top: 24px;
    font-size: 72px;
    font-weight: 900;
    line-height: 1.1;
    color: var(--blue-dark);
    background: var(--yellow);
    border: 5px solid var(--black);
    border-radius: 18px;
    padding: 24px 40px;
    box-shadow: 0 14px 0 var(--red);
    text-align: center;
  }
  .ans-a .ans-label {
    display: block;
    font-size: 26px;
    letter-spacing: 5px;
    font-weight: 900;
    color: var(--red);
    margin-bottom: 10px;
  }

  /* End-of-game: full-screen Top 3 */
  .final-board {
    position: fixed; inset: 0; z-index: 70;
    width: auto; max-width: none;   /* override .view's 1500px cap so it fills the whole screen */
    background: radial-gradient(1200px 800px at 50% -10%, var(--blue-dark) 0%, #0a1234 60%, #060a1f 100%);
    text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  .final-board .fb-title { font-size: 80px; color: var(--yellow); margin: 0; letter-spacing: 4px; text-shadow: 4px 4px 0 var(--red), 8px 8px 0 var(--black); }
  .final-board .fb-list { width: min(1000px, 90vw); display: flex; flex-direction: column; gap: 16px; }
  .final-board .fb-row { display: flex; align-items: center; gap: 24px; background: var(--cream); color: var(--blue-dark); border: 5px solid var(--blue); border-radius: 18px; padding: 18px 34px; }
  .final-board .fb-row.fb-first { background: var(--yellow); border-color: var(--red); }
  .final-board .fb-rank { font-size: 56px; min-width: 72px; }
  .final-board .fb-name { flex: 1; font-size: 52px; font-weight: 800; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .final-board .fb-score { font-size: 58px; font-weight: 900; color: var(--blue); }
  .final-board .fb-empty { font-size: 34px; color: var(--cream); }

  /* End-of-game: winner reveal */
  .winner-screen {
    position: fixed; inset: 0; z-index: 70;
    width: auto; max-width: none;   /* override .view's 1500px cap so it fills the whole screen */
    background: radial-gradient(1200px 800px at 50% -10%, var(--blue-dark) 0%, #0a1234 60%, #060a1f 100%);
    text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  .winner-screen .win-burst { font-size: 90px; animation: turnin-pop .5s cubic-bezier(.2,.8,.3,1.2) both; }
  .winner-screen .win-label { font-size: 46px; color: var(--cream); letter-spacing: 6px; }
  .winner-screen .win-name {
    font-size: 120px; font-weight: 900; line-height: 1.04; color: var(--yellow);
    text-shadow: 5px 5px 0 var(--red), 10px 10px 0 var(--black);
    animation: turnin-pop .55s cubic-bezier(.2,.8,.3,1.2) both;
    max-width: 92vw;
  }
  .winner-screen .win-prize {

const STORAGE_KEY = "pluckers-trivia-rounds";

// ---- Question timer ----
const TIMER_KEY = "pluckers-trivia-timer";
let TIMER_SECS = (function () { const n = parseInt(localStorage.getItem(TIMER_KEY), 10); return isNaN(n) ? 0 : n; })(); // 0 = off
let TIMER_END = 0;                 // epoch ms the current question's timer ends (0 = none)
function saveTimer() { try { localStorage.setItem(TIMER_KEY, String(TIMER_SECS)); } catch (e) {} }

// ---- Scoreboard / leaderboard ----
// Host enters team names + scores, then PUBLISHES to show a leaderboard on the TVs.
const TEAMS_KEY = "pluckers-trivia-teams";
function loadTeams() {
  try {
    const t = JSON.parse(localStorage.getItem(TEAMS_KEY));
    if (Array.isArray(t)) return t.map(x => ({ name: String(x.name || ""), score: Number(x.score) || 0 }));
  } catch (e) {}
  return [];
}
function saveTeams() { try { localStorage.setItem(TEAMS_KEY, JSON.stringify(TEAMS)); } catch (e) {} }
let TEAMS = loadTeams();      // [{ name, score }]
let LB_SHOWN = false;         // is the leaderboard currently published to the TVs?
function standings() { return TEAMS.slice().sort((a, b) => b.score - a.score); }

// ============================================================
// STATE
// ============================================================
const State = {
  TITLE: "title",
  ROUND_INTRO: "round_intro",
  QUESTION: "question",
  TURN_IN: "turn_in",     // "TURN IN YOUR ANSWER SHEET!" after a round's last question
  ANSWER: "answer",       // one question + its answer, revealed one screen at a time
  FINAL_BOARD: "final_board", // full-screen Top 3 at the very end
  WINNER: "winner",       // winning team + "collect your prize"
  ROUND_END: "round_end", // (legacy full answer list — no longer scheduled)
  END: "end"
};

const game = {
  state: State.TITLE,
  roundIdx: 0,
  questionIdx: 0,
  answersIdx: 0,
  isFinal: false,  // board/winner: true = all-time (end), false = after a round
  cursor: 0        // position in SCHEDULE (the full ordered list of screens)
};

// The whole game is a flat, ordered list of screens, computed from ROUNDS.
// Each round: intro → its questions → TURN IN → that round's answers shown
// ONE AT A TIME (before the next round). Last round's answers come before the end.
let SCHEDULE = [];
function buildSchedule() {
  const s = [{ state: State.TITLE }];
  const N = ROUNDS.length;
  for (let r = 0; r < N; r++) {
    const len = ROUNDS[r].questions.length;
    s.push({ state: State.ROUND_INTRO, roundIdx: r });
    for (let qi = 0; qi < len; qi++) {
      s.push({ state: State.QUESTION, roundIdx: r, questionIdx: qi });
    }
    s.push({ state: State.TURN_IN, roundIdx: r });
    for (let qi = 0; qi < len; qi++) {   // reveal each answer of this round, one screen each
      s.push({ state: State.ANSWER, roundIdx: r, questionIdx: qi });
    }
    if (r < N - 1) {
      // After each round (except the last): standings + the leader so far.
      s.push({ state: State.FINAL_BOARD, roundIdx: r, final: false });
      s.push({ state: State.WINNER, roundIdx: r, final: false });
    } else {
      // After the final round: all-time Top 3 + the overall champion.
      s.push({ state: State.FINAL_BOARD, final: true });
      s.push({ state: State.WINNER, final: true });
    }
  }
  s.push({ state: State.END });
  SCHEDULE = s;
}
function applyFrame(f) {
  if (!f) return;
  game.state       = f.state;
  game.roundIdx    = f.roundIdx    || 0;
  game.questionIdx = f.questionIdx || 0;
  game.answersIdx  = (f.answersIdx != null) ? f.answersIdx : 0;
  game.isFinal     = !!f.final;
}
function gotoCursor(n) {
  game.cursor = Math.max(0, Math.min(n, SCHEDULE.length - 1));
  applyFrame(SCHEDULE[game.cursor]);
  // Host starts a fresh countdown each time it lands on a question.
  if (game.state === State.QUESTION && TIMER_SECS > 0) {
    TIMER_END = Date.now() + TIMER_SECS * 1000;
  } else {
    TIMER_END = 0;
  }
  render();
}

const main = document.getElementById("main");
const meta = document.getElementById("meta");

function totalQuestions() {
  return ROUNDS.reduce((sum, r) => sum + r.questions.length, 0);
}
function questionGlobalIndex() {
  let n = 0;
  for (let i = 0; i < game.roundIdx; i++) n += ROUNDS[i].questions.length;
  return n + game.questionIdx + 1;
}

function renderMeta() {
  if (game.state === State.TITLE || game.state === State.END ||

}

    TIMER_SECS = Math.max(0, parseInt(ti.value, 10) || 0);

    saveTimer();
    if (live.role === "host") pushState();

function viewFinalBoard() {
  const medals = ["🥇", "🥈", "🥉"];
  const top = standings().slice(0, 3);

// Build a burst of falling confetti pieces for the champion screen.
function spawnConfetti() {
  const box = document.getElementById("confetti");
  if (!box) return;
  const colors = ["#fd1d1e", "#f4c430", "#1d3a8a", "#ffd84d", "#f7f1e3", "#2a52be"];
  let html = "";
  for (let i = 0; i < 70; i++) {
    const left = Math.floor(Math.random() * 100);
    const delay = (Math.random() * 3.5).toFixed(2);
    const dur = (2.6 + Math.random() * 2.6).toFixed(2);
    const drift = Math.floor(Math.random() * 60 - 30);
    const wpx = 8 + Math.floor(Math.random() * 9);
    const color = colors[Math.floor(Math.random() * colors.length)];
    html += '<i class="confetti-piece" style="left:' + left + '%;background:' + color +
            ';width:' + wpx + 'px;height:' + Math.round(wpx * 1.6) + 'px;animation-delay:' + delay +
            's;animation-duration:' + dur + 's;--drift:' + drift + 'px;"></i>';

  box.innerHTML = html;
}

// Scale the answer list so every question+answer fits on one screen with
// no scrolling and as little empty space as possible.
function fitAnswers() {
  const box = main.querySelector(".qa-list");
  if (!box) return;
  const ol = box.querySelector("ol");
  if (!ol) return;

  const fits = () =>
    ol.scrollHeight <= box.clientHeight && ol.scrollWidth <= box.clientWidth;

  const MIN = 14, MAX = 64;
  // Binary search for the largest base font-size that still fits.
  let lo = MIN, hi = MAX, best = MIN;
  for (let i = 0; i < 18; i++) {
    const mid = (lo + hi) / 2;
    box.style.fontSize = mid + "px";
    if (fits()) { best = mid; lo = mid; }
    else { hi = mid; }
  }
  box.style.fontSize = best + "px";
}

document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  // Let typing flow normally into form fields (e.g. the TV code box).
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (document.getElementById("loadModal")) {
    if (e.key === "Escape") {
      e.preventDefault();
      closeLoadModal();
    }
    return;
  }
  // On any TV / display screen, the only key that does anything is fullscreen.
  if (document.body.classList.contains("display-mode")) {
    if (e.key === "f" || e.key === "F") { e.preventDefault(); toggleFullscreen(); }
    return;
  }
  switch (e.key) {
    case " ":
    case "ArrowRight":
    case "Enter":
      e.preventDefault();
      advance();
      break;
    case "ArrowLeft":
      e.preventDefault();
      goBack();
      break;
    case "f":
    case "F":
      e.preventDefault();
      toggleFullscreen();
      break;
    case "l":
    case "L":
      if (game.state === State.TITLE) {
        e.preventDefault();
        openLoadModal();
      }
      break;
    case "Escape":
      e.preventDefault();
      if (game.state !== State.TITLE) backToMenu();
      break;
  }
});

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}

function loadRounds() {
  try {
    const raw = localStorage.getItem("pluckers-trivia-rounds");
    if (!raw) return DEFAULT_ROUNDS;
    const parsed = JSON.parse(raw);
    if (validateRounds(parsed)) return normalizeRounds(parsed);
  } catch (e) { /* fall through */ }
  return DEFAULT_ROUNDS;
}

function saveRounds(rounds) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(rounds));
}

function clearStoredRounds() {
  localStorage.removeItem(STORAGE_KEY);
}

// Internal shape: { category, questions: [{q, a}] }
function validateRounds(data) {
  if (!Array.isArray(data) || data.length === 0) {
    throw new Error("Must be a non-empty list of categories.");
  }
  for (let i = 0; i < data.length; i++) {
    const r = data[i];
    if (!r || typeof r.category !== "string" || !r.category.trim()) {
      throw new Error(`Category ${i + 1}: missing or empty 'category' name.`);
    }
    if (!Array.isArray(r.questions) || r.questions.length === 0) {
      throw new Error(`Category "${r.category}": needs at least one question.`);
    }
    for (let j = 0; j < r.questions.length; j++) {
      const q = r.questions[j];
      if (typeof q === "string") {
        if (!q.trim()) throw new Error(`Category "${r.category}", question ${j + 1}: empty.`);
      } else if (q && typeof q === "object") {
        if (typeof q.q !== "string" || !q.q.trim()) {
          throw new Error(`Category "${r.category}", question ${j + 1}: missing 'q' text.`);
        }
        if (q.a !== undefined && q.a !== null && typeof q.a !== "string") {
          throw new Error(`Category "${r.category}", question ${j + 1}: 'a' must be a string.`);
        }
      } else {
        throw new Error(`Category "${r.category}", question ${j + 1}: must be a string or {q, a} object.`);
      }
    }
  }
  return true;
}

function normalizeRounds(data) {
  return data.map(r => ({
    category: r.category.trim(),
    questions: r.questions.map(q => {
      if (typeof q === "string") return { q: q.trim(), a: "" };
      return { q: (q.q || "").trim(), a: (q.a || "").trim() };
    })
  }));
}

function parseJsonRounds(text) {
  const parsed = JSON.parse(text);
  validateRounds(parsed);
  return normalizeRounds(parsed);
}

// Text format:
//   ## Category Name
//   Question 1? | Answer
//   Question 2? | Answer
//
//   ## Next Category
//   ...
// The "| Answer" portion is optional. " | " or " :: " both work as separators.
function parseTextRounds(text) {
  const lines = text.split(/\r?\n/);
  const rounds = [];
  let current = null;
  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;
    const catMatch = line.match(/^#{1,3}\s*(.+)$/);
    if (catMatch) {
      current = { category: catMatch[1].trim(), questions: [] };
      rounds.push(current);
    } else {
      if (!current) {
        throw new Error("Text must start with a category header (e.g. '## Sports') before any questions.");
      }
      // Split question/answer on " | " (preferred) or " :: "
      let q = line, a = "";
      const sepMatch = line.match(/^(.*?)\s*(?:\||::)\s*(.+)$/);
      if (sepMatch) {
        q = sepMatch[1].trim();
        a = sepMatch[2].trim();
      }
      current.questions.push({ q, a });
    }
  }
  validateRounds(rounds);
  return normalizeRounds(rounds);
}

function applyRounds(rounds) {
  saveRounds(rounds);
  ROUNDS = rounds;
  buildSchedule();
  gotoCursor(0);   // back to the title with the new question set
}

function templateJson() {
  return JSON.stringify(DEFAULT_ROUNDS.slice(0, 1).map(r => ({
    category: r.category,
    questions: r.questions.slice(0, 3)
  })), null, 2);
}

function showModalMsg(text, type) {
  const el = document.getElementById("msgArea");
  if (!el) return;
  el.innerHTML = `<div class="${type === "ok" ? "ok-msg" : "error-msg"}">${escapeHtml(text)}</div>`;
}

function handleFilePicked(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById("pasteArea").value = ev.target.result;
    if (file.name.toLowerCase().endsWith(".json")) {
      modalFormat = "json";
    } else if (file.name.toLowerCase().endsWith(".txt")) {
      modalFormat = "text";
    }
    document.querySelectorAll(".format-tab").forEach(t => {
      t.classList.toggle("active", t.dataset.fmt === modalFormat);
    });
    updateFormatHelp();
    showModalMsg(`Loaded "${file.name}". Review and click APPLY to use these questions.`, "ok");
  };
  reader.onerror = () => showModalMsg("Could not read that file.", "err");
  reader.readAsText(file);
}

function applyFromModal() {
  const text = document.getElementById("pasteArea").value.trim();
  if (!text) {
    showModalMsg("Paste questions or pick a file first.", "err");
    return;
  }
  try {
    let parsed;
    if (modalFormat === "json") {
      parsed = parseJsonRounds(text);
    } else {
      // Auto-detect JSON if text starts with [
      if (text.startsWith("[")) {
        try { parsed = parseJsonRounds(text); }
        catch { parsed = parseTextRounds(text); }
      } else {
        parsed = parseTextRounds(text);
      }
    }
    applyRounds(parsed);
    const total = parsed.reduce((n, r) => n + r.questions.length, 0);
    showModalMsg(`Loaded ${parsed.length} categories, ${total} questions.`, "ok");
    setTimeout(() => {
      closeLoadModal();
      render();
    }, 600);
  } catch (err) {
    showModalMsg("Could not load: " + err.message, "err");
  }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Make a near-white background in the logo transparent at runtime, so the logo
// floats on the page with no white box even if the PNG isn't transparent.
// (Works when the page is served over http — Netlify or a localhost preview.
//  Over file:// the browser blocks reading the pixels, so it leaves it as-is.)
function deWhiteLogo(img) {
  if (!img || img.dataset.dewhited || !img.naturalWidth) return;
  try {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const px = ctx.getImageData(0, 0, c.width, c.height);
    const d = px.data;
    for (let i = 0; i < d.length; i += 4) {
      // Only knock out pixels that are essentially white (keeps yellow/red/blue).
      if (d[i] > 238 && d[i + 1] > 238 && d[i + 2] > 238) d[i + 3] = 0;
    }
    ctx.putImageData(px, 0, 0);
    img.dataset.dewhited = "1";
    img.src = c.toDataURL("image/png");
  } catch (e) {
    /* file:// or cross-origin — leave the logo untouched */
  }
}
function processLogos() {
  document.querySelectorAll(".brand-logo-img, .title-logo-img").forEach((im) => {
    if (im.dataset.dewhited) return;
    if (im.complete && im.naturalWidth) deWhiteLogo(im);
    else im.addEventListener("load", () => deWhiteLogo(im), { once: true });
  });
}

// Fresh, unique room code per session so several locations never collide.
function makeRoomCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no ambiguous 0/O/1/I/L
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function tvBaseUrl() {

  return tvBaseUrl() + "&room=" + encodeURIComponent(live.code || "");
}
// A URL a phone on another device can't reach (running off your PC, not the web).
function isLocalUrl() {
  const h = location.hostname;
  return location.protocol === "file:" ||
         h === "localhost" || h === "127.0.0.1" || h === "" ||
         h.endsWith(".local") || /^192\.168\./.test(h) || /^10\./.test(h);
}

    round_idx: game.roundIdx,   // cosmetic

async function resumeHostIfAny() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(HOST_RESUME_KEY)); } catch (e) {}
  // Only auto-resume a recent session (within 8 hours) to avoid stale rooms.
  if (!saved || !saved.code || !liveConfigured() || (Date.now() - (saved.t || 0)) > 8 * 3600 * 1000) {
    render();
    return;
  }
  try {
    const { data } = await liveClient().from(LIVE_TABLE).select("*").eq("room_code", saved.code).maybeSingle();
    if (!data) { render(); return; }
    live.role = "host";
    live.code = saved.code;
    // restore the exact position + questions + timer
    if (Array.isArray(data.rounds) && data.rounds.length) { ROUNDS = data.rounds; buildSchedule(); }
    try {
      const ex = JSON.parse(data.state);
      if (typeof ex.timerSecs === "number") TIMER_SECS = ex.timerSecs;
    } catch (e) {}
    game.cursor = Math.max(0, Math.min((data.question_idx | 0), SCHEDULE.length - 1));
    applyFrame(SCHEDULE[game.cursor]);
    rememberHostSession();
    render();
    showLiveBanner();
  } catch (e) {
    render();
  }
}

async function pushState() {
  if (live.role !== "host" || !live.code) return;
  try {
    await liveClient().from(LIVE_TABLE).upsert(snapshot());
  } catch (e) { /* a dropped update will be corrected by the next one */ }
}

function stopLive() {
  if (live.channel && live.sb) live.sb.removeChannel(live.channel);
  live.role = "off"; live.code = null; live.channel = null;
  try { localStorage.removeItem(HOST_RESUME_KEY); } catch (e) {}   // don't auto-resume after an intentional stop
  const el = document.getElementById("liveBanner");
  if (el) el.remove();
}

function showLiveBanner() {
  let el = document.getElementById("liveBanner");
  if (!el) { el = document.createElement("div"); el.id = "liveBanner"; document.body.appendChild(el); }
  const url = tvUrl();
  const local = isLocalUrl();
  const warn = local
    ? '<div class="lb-warn">⚠ This link only works on this computer. To use it on your TVs, ' +
      'put the game online (drag the folder to <b>app.netlify.com/drop</b>) and press GO LIVE there.</div>'
    : '';
  el.innerHTML =
    '<div class="lb-dot"></div>' +
    '<div class="lb-info">' +
      '<div class="lb-title">● LIVE — ROOM CODE</div>' +
      '<div class="lb-code">' + live.code + '</div>' +
      '<div class="lb-howto">On each TV open <b>' + escapeHtml(tvBaseUrl()) + '</b> and enter this code (or scan ⟶)</div>' +
      warn +
    '</div>' +
    '<div class="lb-qr" id="lbQr"></div>' +
    '<button class="lb-stop" id="lbStop">STOP</button>';
  document.getElementById("lbStop").addEventListener("click", stopLive);
  const qr = document.getElementById("lbQr");
  if (typeof QRCode !== "undefined" && qr && !local) {
    try { new QRCode(qr, { text: url, width: 92, height: 92, correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { qr.style.display = "none"; }
  } else if (qr) {
    qr.style.display = "none";   // hide the dead QR when running locally
  }
}

// ---- Display (mirror) ----
async function connectAsDisplay(code) {
  live.role = "display";
  live.code = code;
  document.body.classList.add("display-mode");
  try { localStorage.setItem(TV_ROOM_KEY, code); } catch (e) {}   // remember for refresh

  if (!liveConfigured()) {
    main.innerHTML =
      '<div class="view"><h2 style="color:var(--yellow)">Live screens not set up</h2>' +
      '<p style="color:var(--cream)">This file has no Supabase keys, so it can\'t join room <b>' +
      escapeHtml(code) + '</b>.</p></div>';
    return;
  }

  const sb = liveClient();
  showDisplayTag();
  mountTvChrome();

  // Load whatever the room is currently showing.
  try {
    const { data } = await sb.from(LIVE_TABLE).select("*").eq("room_code", code).maybeSingle();
    if (data) applyRemote(data);
    else showDisplayWaiting();
  } catch (e) { showDisplayWaiting(); }

  // Then live-subscribe to every change the host makes.
  live.channel = sb.channel("room-" + code)
    .on("postgres_changes",
        { event: "*", schema: "public", table: LIVE_TABLE, filter: "room_code=eq." + code },
        (payload) => { if (payload.new) applyRemote(payload.new); })
    .subscribe();
}

function applyRemote(row) {
  live.applying = true;
  if (Array.isArray(row.rounds) && row.rounds.length) { ROUNDS = row.rounds; buildSchedule(); }
  // The `state` field carries the timer alongside the screen name.
  try {
    const ex = JSON.parse(row.state);
    if (ex && typeof ex === "object") {
      if (typeof ex.timerSecs === "number") TIMER_SECS = ex.timerSecs;
      TIMER_END = ex.timerEnd || 0;
      if (ex.lb && typeof ex.lb === "object") {
        if (Array.isArray(ex.lb.teams)) TEAMS = ex.lb.teams.map(t => ({ name: String(t.name || ""), score: Number(t.score) || 0 }));
        LB_SHOWN = !!ex.lb.shown;
      }
    }
  } catch (e) { /* older/plain state string — ignore */ }
  game.cursor = Math.max(0, Math.min((row.question_idx | 0), SCHEDULE.length - 1));
  applyFrame(SCHEDULE[game.cursor]);
  live.applying = false;
  render();
  updateLeaderboardOverlay();   // show/refresh/hide the published leaderboard on this TV
}

function showDisplayTag() {
  let el = document.getElementById("displayTag");
  if (!el) { el = document.createElement("div"); el.id = "displayTag"; document.body.appendChild(el); }
  el.textContent = "MIRRORING • ROOM " + live.code;
  el.title = "Click to change room";
  el.style.cursor = "pointer";
  el.onclick = function () {
    if (confirm("Change room? This screen will ask for a new code.")) {
      try { localStorage.removeItem(TV_ROOM_KEY); } catch (e) {}
      location.href = location.origin + location.pathname + "?tv";
    }
  };
}

// Inject the always-on TV chrome: a WIN PRIZES badge (left) + Instructions (right).
// Both live in #app, outside <main>, so they persist across question re-renders.
function mountTvChrome() {
  const app = document.getElementById("app");

  if (!document.getElementById("tvWinPrizes")) {
    const wp = document.createElement("div");
    wp.id = "tvWinPrizes";
    wp.className = "win-prizes";
    wp.innerHTML =
      '<span class="wp-top">WIN</span>' +
      '<span class="wp-big">PRIZES!</span>';
    app.appendChild(wp);
  }

  if (!document.getElementById("tvInstructions")) {
    const ins = document.createElement("div");
    ins.id = "tvInstructions";
    ins.className = "instructions";
    ins.innerHTML =
      '<div class="instr-header">INSTRUCTIONS</div>' +
      '<ol class="instr-list">' +
        '<li><b>Grab an answer sheet.</b></li>' +
        '<li>Write each answer in its <b>numbered box.</b></li>' +
        '<li>Turn it in after each round.</li>' +
        '<li><b>Host announces the winners!</b></li>' +
      '</ol>';
    app.appendChild(ins);
  }

  if (!document.getElementById("lbOverlay")) {
    const ov = document.createElement("div");
    ov.id = "lbOverlay";
    document.body.appendChild(ov);   // full-screen takeover when the host publishes
  }
}

// Show/hide + populate the published leaderboard on a TV. Called when remote
// state arrives. Renders nothing unless the host has published it.
function updateLeaderboardOverlay() {
  const ov = document.getElementById("lbOverlay");
  if (!ov) return;
  // The full-screen board/winner take over completely — never show the banner there.
  const finale = (game.state === State.FINAL_BOARD || game.state === State.WINNER);
  if (!LB_SHOWN || finale) { ov.classList.remove("show"); return; }
  const medals = ["🥇", "🥈", "🥉"];
  const rows = standings().slice(0, 3).map((t, i) =>   // top 3 only
    '<div class="lbo-row' + (i === 0 ? ' lbo-first' : '') + '">' +
      '<span class="lbo-rank">' + medals[i] + '</span>' +
      '<span class="lbo-name">' + escapeHtml(t.name) + '</span>' +
      '<span class="lbo-score">' + t.score + '</span>' +
    '</div>'
  ).join("");
  ov.innerHTML =
    '<div class="lbo-card">' +
      '<div class="lbo-list">' + (rows || '<div class="lbo-empty">No teams yet</div>') + '</div>' +
    '</div>';
  ov.classList.add("show");
}

// Host-only scoreboard manager: enter team names + scores, then publish to TVs.
function openScoreboardModal() {
  const root = document.getElementById("modalRoot");
  function statusHtml() {
    return LB_SHOWN
      ? '<span style="color:#2ed573;font-weight:800">● Showing on the TVs</span>'
      : '<span style="color:#9fb6c8">Hidden from the TVs</span>';
  }
  function rowsHtml() {
    if (!TEAMS.length) return '<p class="sb-empty">No teams yet — add one below.</p>';
    return TEAMS.map((t, i) =>
      '<div class="sb-row">' +
        '<input class="sb-name" data-i="' + i + '" value="' + escapeHtml(t.name) + '" placeholder="Team name" />' +
        '<input class="sb-score" type="number" inputmode="numeric" data-i="' + i + '" value="' + t.score + '" />' +
        '<button class="sb-del" data-i="' + i + '" title="Remove">✕</button>' +
      '</div>'
    ).join("");
  }
  function draw() {
    root.innerHTML =
      '<div class="modal-backdrop" id="loadModal">' +
        '<div class="modal" role="dialog" aria-label="Scoreboard">' +
          '<button class="close-x" id="closeX" aria-label="Close">×</button>' +
          '<h2>🏆 Scoreboard</h2>' +
          '<p class="modal-lead">Enter team names and scores. Press <b>PUBLISH</b> to show the leaderboard on the TVs (press again anytime to refresh it). <b>HIDE</b> takes it back off.</p>' +
          '<div class="sb-status">' + statusHtml() + '</div>' +
          '<div id="sbRows" class="sb-rows">' + rowsHtml() + '</div>' +
          '<button class="btn secondary" id="sbAdd" style="margin-top:6px">➕ Add team</button>' +
          '<div class="modal-actions">' +
            '<button class="btn secondary" id="sbHide">HIDE FROM TVs</button>' +
            '<button class="btn" id="sbPublish">📢 PUBLISH TO TVs</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    wire();
  }
  function wire() {
    document.getElementById("closeX").addEventListener("click", closeLoadModal);
    document.getElementById("sbAdd").addEventListener("click", function () {
      TEAMS.push({ name: "", score: 0 }); saveTeams(); draw();
      const last = root.querySelector('.sb-name[data-i="' + (TEAMS.length - 1) + '"]');
      if (last) last.focus();
    });
    document.getElementById("sbPublish").addEventListener("click", function () {
      LB_SHOWN = true; saveTeams();
      if (live.role === "host") pushState();
      draw();
    });
    document.getElementById("sbHide").addEventListener("click", function () {
      LB_SHOWN = false;
      if (live.role === "host") pushState();
      draw();
    });
    root.querySelectorAll(".sb-name").forEach(function (inp) {
      inp.addEventListener("input", function () { TEAMS[+inp.dataset.i].name = inp.value; saveTeams(); });
    });
    root.querySelectorAll(".sb-score").forEach(function (inp) {
      inp.addEventListener("input", function () { TEAMS[+inp.dataset.i].score = Number(inp.value) || 0; saveTeams(); });
    });
    root.querySelectorAll(".sb-del").forEach(function (btn) {
      btn.addEventListener("click", function () { TEAMS.splice(+btn.dataset.i, 1); saveTeams(); draw(); });
    });
  }
  draw();
}

// On TVs, show the WIN PRIZES badge + Instructions panel only on the title +
// round-intro screens (hidden during questions / answers so content stays clear).
function updateTvChromeVisibility() {
  if (!document.body.classList.contains("display-mode")) return;
  const s = game.state;
  const show = (s === State.TITLE || s === State.ROUND_INTRO);
  const finale = (s === State.FINAL_BOARD || s === State.WINNER);
  const wp  = document.getElementById("tvWinPrizes");
  const ins = document.getElementById("tvInstructions");
  const tag = document.getElementById("displayTag");
  if (wp)  wp.style.display  = show ? "" : "none";
  if (ins) ins.style.display = show ? "" : "none";
  if (tag) tag.style.display = finale ? "none" : "";   // nothing over the full-screen finale
}
function showDisplayWaiting() {
  main.innerHTML =
    '<div class="view"><h2 style="color:var(--yellow)">Waiting for the host…</h2>' +
    '<p style="color:var(--cream)">Room <b>' + escapeHtml(live.code) + '</b> isn\'t live yet.<br>' +
    'This screen updates automatically when the host presses GO LIVE.</p></div>';
}

// TV setup screen: shown on the permanent ?tv link so staff just type the
// 4-character code from the host screen (no long URL to type each session).
function showCodeEntry() {
  document.body.classList.add("display-mode");
  main.innerHTML =
    '<div class="view code-entry">' +
      '<h2 class="ce-title">ENTER ROOM CODE</h2>' +
      '<p class="ce-sub">Get the code from the host\'s screen</p>' +
      '<input id="ceInput" class="ce-input" maxlength="4" autocomplete="off" ' +
        'autocapitalize="characters" spellcheck="false" placeholder="• • • •" />' +
      '<button class="btn" id="ceGo">WATCH GAME</button>' +
      '<p id="ceErr" class="ce-err"></p>' +
    '</div>';
  const inp = document.getElementById("ceInput");
  const go = () => {
    const code = (inp.value || "").trim().toUpperCase();
    if (code.length < 3) {
      document.getElementById("ceErr").textContent = "Enter the code shown on the host screen.";
      inp.focus();
      return;
    }
    connectAsDisplay(code);
  };
  document.getElementById("ceGo").addEventListener("click", go);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  inp.focus();
}

// Demo / preview of the TV point-of-view: no host, no Supabase, no code entry.
// Auto-cycles through the TV screens using the built-in sample questions.
function startDemo() {
  document.body.classList.add("display-mode");
  mountTvChrome();
  let tag = document.getElementById("displayTag");
  if (!tag) { tag = document.createElement("div"); tag.id = "displayTag"; document.body.appendChild(tag); }
  tag.textContent = "TV PREVIEW (DEMO)";

  TIMER_SECS = 30;
  TEAMS = [{ name: "The Wingers", score: 42 }, { name: "Cluckers", score: 38 }, { name: "Sauce Bosses", score: 31 }, { name: "Drumstick Dynasty", score: 27 }];
  const steps = [
    { d: 3500, fn: () => { LB_SHOWN = false; game.state = State.TITLE; } },
    { d: 3000, fn: () => { game.state = State.ROUND_INTRO; game.roundIdx = 0; game.questionIdx = 0; } },
    { d: 5000, fn: () => { game.state = State.QUESTION; game.roundIdx = 0; game.questionIdx = 0; TIMER_END = Date.now() + 30000; } },
    { d: 3500, fn: () => { game.state = State.TURN_IN; game.roundIdx = 0; TIMER_END = 0; } },
    { d: 3000, fn: () => { game.state = State.ROUND_INTRO; game.roundIdx = 1; game.questionIdx = 0; } },
    { d: 4500, fn: () => { game.state = State.QUESTION; game.roundIdx = 1; game.questionIdx = 4; TIMER_END = Date.now() + 30000; } },
    { d: 4500, fn: () => { game.state = State.TURN_IN; game.roundIdx = 1; TIMER_END = 0; } },
    { d: 5000, fn: () => { game.state = State.ANSWER; game.roundIdx = 1; game.questionIdx = 0; } },
    { d: 4500, fn: () => { game.state = State.FINAL_BOARD; game.isFinal = false; game.roundIdx = 0; } },  // after-round standings
    { d: 4500, fn: () => { game.state = State.WINNER; game.isFinal = false; game.roundIdx = 0; } },        // round leader
    { d: 5000, fn: () => { game.state = State.FINAL_BOARD; game.isFinal = true; } },                       // all-time top 3
    { d: 6000, fn: () => { game.state = State.WINNER; game.isFinal = true; } },                            // champion
  ];
  let i = 0;
  (function tick() {
    steps[i].fn();
    render();
    updateLeaderboardOverlay();
    const wait = steps[i].d;
    i = (i + 1) % steps.length;
    setTimeout(tick, wait);
  })();
}

// ============================================================
// BOOT
// ============================================================
buildSchedule();
applyFrame(SCHEDULE[0]);   // start on the title screen
processLogos();            // strip any white box from the header logo

// Host scoreboard button (in the header; hidden on TVs via CSS).
(function () {
  const sb = document.getElementById("scoreBtn");
  if (sb) sb.addEventListener("click", openScoreboardModal);
})();

const _params = new URLSearchParams(location.search);
const _isTv = _params.has("tv") || _params.has("screen");
const _roomParam = _params.get("room");
if (_params.has("demo")) {
  startDemo();                                  // TV point-of-view preview (no setup)
} else if (_isTv && _roomParam) {
  connectAsDisplay(_roomParam.toUpperCase());   // TV opened with a code (or scanned)
} else if (_isTv) {
  // Refreshed TV: rejoin the saved room automatically; otherwise ask for the code.
  let _savedRoom = null;
  try { _savedRoom = localStorage.getItem(TV_ROOM_KEY); } catch (e) {}
  if (_savedRoom) connectAsDisplay(_savedRoom);
  else showCodeEntry();
} else {
  resumeHostIfAny();                            // host / admin — resume a live room if we were hosting
}

// Tick the question countdown timer (updates any visible .q-timer each second).
setInterval(() => {
  const el = document.getElementById("qTimer");
  if (!el || !TIMER_END) return;
  const left = Math.max(0, Math.ceil((TIMER_END - Date.now()) / 1000));
  el.textContent = left > 0 ? left : "TIME!";
  el.classList.toggle("q-timer-up", left <= 0);
}, 250);
</script>
